<header>
  <h1 id="htit">Analizador Planificación</h1>
  <p id="hsub">Cargue la malla y los calendarios académicos para ejecutar la validación</p>
</header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
  <footer>El análisis se ejecuta localmente en su navegador. Ningún archivo se envía a internet.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fflate/0.8.2/umd/index.js"></script>
<script>/* ===========================================================================
   ANALIZADOR PLANIFICACIÓN — motor de análisis malla vs calendario
   =========================================================================== */

const REGLAS = {
  creditos_totales_esperados: null,
  creditos_min_periodo: 20,
  creditos_max_periodo: 40,
  tolerancia_hp_horas: 0,
  gap_alerta_dias: 35,
  gap_critico_dias: 60,
  duracion_max_meses: 24,
  duracion_min_meses: 18,
};

const TIPO_EXAMEN = ['examen', 'exam'];
const DIAS_ORDEN = ['LUNES','MARTES','MIERCOLES','JUEVES','VIERNES','SABADO','DOMINGO'];
const DIAS = new Set(DIAS_ORDEN);
const UMBRAL = 0.62;      // similitud mínima para aceptar un emparejamiento
const MARGEN_DUDA = 0.05; // diferencia mínima con el 2º candidato para no marcar duda

/* ---------------------------- utilidades -------------------------------- */
function norm(s) {
  if (s === null || s === undefined) return '';
  return String(s).normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
}

/* ratio equivalente a difflib.SequenceMatcher.ratio() */
function _matches(a, b, alo, ahi, blo, bhi) {
  if (alo >= ahi || blo >= bhi) return 0;
  let bestI = alo, bestJ = blo, bestSize = 0;
  const b2j = new Map();
  for (let j = blo; j < bhi; j++) {
    if (!b2j.has(b[j])) b2j.set(b[j], []);
    b2j.get(b[j]).push(j);
  }
  let j2len = new Map();
  for (let i = alo; i < ahi; i++) {
    const nj = new Map();
    for (const j of (b2j.get(a[i]) || [])) {
      if (j < blo) continue;
      if (j >= bhi) break;
      const k = (j2len.get(j - 1) || 0) + 1;
      nj.set(j, k);
      if (k > bestSize) { bestI = i - k + 1; bestJ = j - k + 1; bestSize = k; }
    }
    j2len = nj;
  }
  if (bestSize === 0) return 0;
  return bestSize
    + _matches(a, b, alo, bestI, blo, bestJ)
    + _matches(a, b, bestI + bestSize, ahi, bestJ + bestSize, bhi);
}

function ratio(a, b) {
  const t = a.length + b.length;
  if (!t) return 1;
  return (2 * _matches(a, b, 0, a.length, 0, b.length)) / t;
}

/* --- comparación de nombres de asignatura (genérica, independiente del programa) --- */
const STOP = new Set(['DE', 'DEL', 'LA', 'EL', 'LOS', 'LAS', 'Y', 'E', 'EN', 'PARA',
  'POR', 'CON', 'A', 'AL', 'UN', 'UNA', 'UNOS', 'UNAS', 'SU', 'SUS', 'SOBRE', 'DESDE']);

/** Plural -> singular (aproximado, suficiente para comparar títulos en español). */
function singular(w) {
  if (w.length > 5 && /ES$/.test(w)) return w.slice(0, -2);
  if (w.length > 4 && /S$/.test(w)) return w.slice(0, -1);
  return w;
}

/** Quita paréntesis aclaratorios y prefijos tipo "Módulo III:" antes de comparar. */
function limpiaTitulo(s) {
  return String(s || '')
    .replace(/\([^)]*\)/g, ' ')
    .replace(/^\s*(m[óo]dulo|unidad|curso|asignatura|taller\s+n)\s*[ivxlcdm\d]*\s*[:.\-]?\s+/i, ' ');
}

function tokens(s) {
  return norm(limpiaTitulo(s)).split(' ').filter(t => t && !STOP.has(t)).map(singular);
}

/** Cobertura de tokens del título más corto dentro del más largo. */
function simTokens(A, B) {
  if (!A.length || !B.length) return 0;
  const [S, L] = A.length <= B.length ? [A, B] : [B, A];
  const usados = new Set();
  let acc = 0;
  S.forEach(a => {
    let best = 0, bi = -1;
    L.forEach((b, i) => {
      if (usados.has(i)) return;
      const r = a === b ? 1 : ((b.startsWith(a) || a.startsWith(b)) ? 0.9 : ratio(a, b));
      if (r > best) { best = r; bi = i; }
    });
    if (best >= 0.75) { acc += best; usados.add(bi); }
  });
  const cobertura = acc / S.length;
  const balance = S.length / L.length;          // penaliza títulos de largo muy distinto
  return cobertura * (0.75 + 0.25 * balance);
}

function similitud(a, b) {
  const na = norm(limpiaTitulo(a)), nb = norm(limpiaTitulo(b));
  if (!na || !nb) return 0;
  if (na === nb) return 1;
  if (na.startsWith(nb) || nb.startsWith(na)) return 0.97;
  const st = simTokens(tokens(a), tokens(b));
  if (st >= 0.999) return 0.95;                 // mismos tokens, distinto orden/plural
  return 0.65 * st + 0.35 * ratio(na, nb);
}

function parseRangoHorario(txt) {
  if (!txt) return [null, null];
  const h = String(txt).match(/(\d{1,2})[:.](\d{2})/g);
  if (!h || h.length < 2) return [null, null];
  const p = s => { const m = s.match(/(\d{1,2})[:.](\d{2})/); return +m[1] * 60 + +m[2]; };
  return [p(h[0]), p(h[1])];
}

const MESES_NUM = { ENERO: 0, FEBRERO: 1, MARZO: 2, ABRIL: 3, MAYO: 4, JUNIO: 5,
  JULIO: 6, AGOSTO: 7, SEPTIEMBRE: 8, SETIEMBRE: 8, OCTUBRE: 9, NOVIEMBRE: 10,
  DICIEMBRE: 11 };

function aFecha(v) {
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if (typeof v === 'number') {          // serial Excel (sistema 1900)
    const ms = Math.round((v - 25569) * 86400000);
    const d = new Date(ms);
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  // texto en español: "martes 26 de mayo 2026", "sábado, 3 de octubre de 2026"
  m = norm(s).match(/(\d{1,2})\s+DE\s+([A-Z]+)\s+(?:DE\s+)?(\d{4})/);
  if (m && MESES_NUM[m[2]] !== undefined) return new Date(+m[3], MESES_NUM[m[2]], +m[1]);
  const n = parseFloat(s);
  if (!isNaN(n) && /^\d+(\.\d+)?$/.test(s)) return aFecha(n);
  return null;
}

/** Formatea una celda de hora (Date, fracción de día o texto) a 'HH:MM'. */
function aHora(v) {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date && !isNaN(v))
    return String(v.getHours()).padStart(2, '0') + ':' + String(v.getMinutes()).padStart(2, '0');
  if (typeof v === 'number' && v >= 0 && v < 1) {
    const t = Math.round(v * 1440);
    return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  }
  return String(v).trim();
}

const iso = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : null;
// Formato de PRESENTACIÓN: DD-MM-AAAA (iso sigue siendo el formato interno para Excel y claves).
// Acepta una fecha (Date) o una cadena ISO "AAAA-MM-DD"; cualquier otra cosa se devuelve igual.
const dmy = v => {
  if (v == null || v === '') return v;
  if (v instanceof Date) return `${String(v.getDate()).padStart(2, '0')}-${String(v.getMonth() + 1).padStart(2, '0')}-${v.getFullYear()}`;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
  return m ? `${m[3]}-${m[2]}-${m[1]}` : v;
};
const dias = (a, b) => Math.round((b - a) / 86400000);
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; };

function diaCercano(fecha, diaNorm) {
  const obj = DIAS_ORDEN.indexOf(diaNorm);
  if (obj < 0) return '-';
  for (let d = 0; d < 8; d++) for (const sg of [1, -1]) {
    const c = new Date(fecha.getTime() + d * sg * 86400000);
    if ((c.getDay() + 6) % 7 === obj) return dmy(c);
  }
  return '-';
}

/* ------------------------------ lectura --------------------------------- */
function filasDe(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true });
}

/** Todas las hojas del libro como [{nombre, filas}]. */
function filasDeHojas(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
  return wb.SheetNames.map(n => ({
    nombre: n,
    filas: XLSX.utils.sheet_to_json(wb.Sheets[n],
      { header: 1, raw: true, defval: null, blankrows: true }),
  }));
}

/** Elige la hoja que rinde más sesiones calendarizadas (el calendario no siempre
    es la primera hoja: puede venir tras una hoja de malla o de notas). */
function leerCalendarioMejor(hojas) {
  // Regla: usar SIEMPRE la primera pestaña del libro. Se salta una hoja inicial
  // que no sea calendario (p. ej. una hoja de malla, como en DMDE) exigiendo un
  // mínimo de sesiones con fecha. NO se suman ni combinan otras hojas: si el libro
  // trae una hoja vigente y otra que es un borrador o una versión anterior
  // (DNIA: Hoja1 vs "Propuesta I"), se toma solo la primera válida.
  const MIN_SESIONES = 3;
  const omitidas = [];
  for (const h of hojas) {
    let r;
    try { r = leerCalendario(h.filas); } catch (e) { continue; }
    const conFecha = r.bloques.reduce((t, b) =>
      t + b.sesiones.filter(s => s.fecha).length, 0);
    if (conFecha < MIN_SESIONES) { if (conFecha) omitidas.push(h.nombre); continue; }
    return Object.assign({}, r, {
      hoja: h.nombre, hojas: [h.nombre], conFecha, totales: r.totales || [],
      otrasHojas: hojas.filter(x => x.nombre !== h.nombre).map(x => x.nombre),
    });
  }
  return { bloques: [], notas: [], formato: '-', hoja: '', hojas: [], conFecha: 0,
           otrasHojas: omitidas };
}

function leerMalla(filas, programa) {
  const hdr = (filas[0] || []).map(norm);
  const idx = {}; hdr.forEach((h, i) => { if (!(h in idx)) idx[h] = i; });
  const g = (r, k) => { const i = idx[k]; return (i !== undefined && r[i] != null) ? r[i] : ''; };
  const out = [];
  for (const r of filas.slice(1)) {
    if (!r || !g(r, 'SIGLA')) continue;
    const prog = String(g(r, 'PROGRAMA')).trim();
    if (programa && norm(prog) !== norm(programa)) continue;
    out.push({
      programa: prog, periodo: String(g(r, 'PERIODO')).trim(),
      sigla: String(g(r, 'SIGLA')).trim(), nombre: String(g(r, 'NOMBRE')).trim(),
      cs: num(g(r, 'CS')), ha: num(g(r, 'HA')), hp: num(g(r, 'HP')), hnp: num(g(r, 'HNP')),
      tn: String(g(r, 'TN')), ta: String(g(r, 'TA')), cp: String(g(r, 'CP')), rt: String(g(r, 'RT')),
    });
  }
  return out;
}

/** Elige, entre todos los programas de la malla, el que mejor calza con los títulos
    del calendario. Evita tener que saber de antemano a qué plan pertenece el archivo. */
function detectarPrograma(filasMalla, bloques) {
  const progs = programasDe(filasMalla);
  if (!progs.length || !bloques.length) return null;
  const ranking = [];
  progs.forEach(([p]) => {
    const malla = leerMalla(filasMalla, p);
    if (!malla.length) return;
    let suma = 0, calzan = 0;
    bloques.forEach(b => {
      let best = 0;
      malla.forEach(a => {
        const s = similitud(b.titulo, a.nombre);
        if (s > best) best = s;
        if (b.alt) { const sa = similitud(b.alt, a.nombre); if (sa > best) best = sa; }
      });
      suma += best;
      if (best >= UMBRAL) calzan++;
    });
    const cobertura = calzan / bloques.length;
    ranking.push({
      programa: p, calzan, bloques: bloques.length, asignaturas: malla.length,
      puntaje: cobertura * 0.75 + (suma / bloques.length) * 0.25,
    });
  });
  ranking.sort((a, b) => b.puntaje - a.puntaje);
  return ranking.length ? { mejor: ranking[0], ranking: ranking.slice(0, 5) } : null;
}

/** Programas disponibles en el archivo de malla (para el selector). */
function programasDe(filas) {
  const hdr = (filas[0] || []).map(norm);
  const ip = hdr.indexOf('PROGRAMA'), is = hdr.indexOf('SIGLA');
  if (ip < 0) return [];
  const set = new Map();
  for (const r of filas.slice(1)) {
    if (!r || (is >= 0 && !r[is])) continue;
    const p = String(r[ip] == null ? '' : r[ip]).trim();
    if (p) set.set(p, (set.get(p) || 0) + 1);
  }
  return [...set.entries()].sort((a, b) => b[1] - a[1]);
}

/* ---- detección de formato y lector tabular (calendarios con encabezado) ---- */
/* Patrones de encabezado, del más específico al más laxo (el orden define prioridad). */
const COLPAT = {
  fecha:      [/^FECHAS?$/, /^(NUEVA|NVA|ULTIMA) FECHA$/, /^DIAS? ?\/? ?FECHAS?$/, /FECHA/],
  dia:        [/^DIAS?$/, /^DIA DE LA SEMANA$/, /^DIA ?\/? ?SEM/, /^DIA /],
  horario:    [/^HORARIOS?$/, /^HORA$/, /HORARIO/],
  horas:      [/^HORAS?$/, /^HRS\.?$/, /^HORAS ACADEMICAS$/, /^(N|NRO|CANT) ?HORAS$/],
  asignatura: [/^ASIGNATURAS?$/, /^CURSOS?$/, /^RAMOS?$/, /^MATERIAS?$/, /^MODULOS?$/],
  tema:       [/^TEMAS?$/, /^CONTENIDOS?$/, /^ACTIVIDAD(ES)?$/, /^DETALLE$/],
  profesor:   [/^PROFESOR(A|ES|AS)?$/, /^DOCENTES?$/, /^RELATOR(A|ES)?$/, /PROFESOR/],
  sede:       [/^SEDES?$/, /^CAMPUS$/, /^LUGAR(ES)?$/],
  sala:       [/^SALAS?$/],
  modalidad:  [/^MODALIDAD$/, /^FORMATO$/],
  sesion:     [/^SESION$/, /^N ?SESION$/, /^(NRO|NUM) ?SESION$/, /SESION/],
};

/** Quita el marcador de sesión pegado al nombre de la asignatura
    ("Transición a la sostenibilidad 1", "... Ex.") para poder agrupar las sesiones.
    No toca numerales romanos, que suelen ser parte del nombre ("Coaching Individual II"). */
function tituloBase(s) {
  return String(s || '')
    .replace(/\s*[-–—]?\s*(n°|nro\.?|n\.?)?\s*(\d{1,2}|ex\.?|examen|ayudant[ií]a)\s*$/i, '')
    .trim() || String(s || '').trim();
}

/** Etiquetas de sesión genéricas: si la columna TEMA es mayormente esto, no es
    el nombre de la asignatura (ej. "Clase 1", "Examen"). */
const TEMA_GENERICO = /^(CLASE|SESION|EXAMEN|AYUDANTIA|PRUEBA|CONTROL|CATEDRA|TALLER|MODULO|EX)\s*\d*[AB]?$/;

/** Mapea las columnas de UNA fila (rótulo -> índice). ok=true si parece un encabezado. */
function _mapaFila(r) {
  const map = {}, rank = {};
  (r || []).forEach((c, j) => {
    const t = norm(c);
    if (!t) return;
    for (const k in COLPAT) {
      const p = COLPAT[k].findIndex(re => re.test(t));
      if (p < 0) continue;
      if (map[k] === undefined || p < rank[k]) { map[k] = j; rank[k] = p; }
      return;
    }
  });
  const apoyo = ['horario', 'horas', 'asignatura', 'profesor', 'tema']
    .filter(k => map[k] !== undefined).length;
  return { map, apoyo, ok: map.fecha !== undefined && apoyo >= 2 };
}

/** Busca la fila de encabezado y mapea columna -> índice. Null si no es tabular. */
function detectarEncabezado(filas) {
  for (let i = 0; i < Math.min(25, filas.length); i++) {
    const m = _mapaFila(filas[i]);
    if (m.ok) return { fila: i, map: m.map };
  }
  return null;
}

/** Todas las filas-encabezado del libro. Un mismo archivo puede traer varias sub-tablas
    con encabezados distintos (ej. un consolidado Diplomado Año 1 + Magíster Año 2, con
    las columnas corridas), cada una con su propio mapeo de columnas. */
function detectarEncabezados(filas) {
  const hs = [];
  for (let i = 0; i < filas.length; i++) {
    const m = _mapaFila(filas[i]);
    if (m.ok) hs.push({ fila: i, map: m.map });
  }
  return hs;
}

function leerCalendarioTabular(filas, hdr, desde) {
  const map = hdr.map, bloques = [], notas = [], porNombre = new Map(), totales = [];
  // fila desde donde se recorren las sesiones. Por defecto, justo tras el encabezado; con
  // `desde` se puede empezar antes (para captar títulos de módulo que van sobre el 1er
  // encabezado cuando el encabezado se repite en cada módulo con la misma estructura).
  const inicioLoop = (desde !== undefined) ? desde : hdr.fila + 1;
  const cel = (r, k) => (map[k] !== undefined && r[map[k]] != null) ? r[map[k]] : '';
  let tituloModulo = '', colHoras = map.horas;
  // rótulo de la última fila de texto suelto (candidato a título de una nueva sección)
  let seccionPend = '';
  // acumulador del tramo actual: horas leídas desde el último total declarado
  let segAcc = 0, segN = 0, segIni = 0, segClaves = new Set();

  // ¿La columna TEMA hace de nombre de asignatura? Ocurre cuando no hay columna
  // "Asignatura" y los temas no son etiquetas genéricas ("Clase 1", "Examen").
  let temaEsAsignatura = false;
  if (map.asignatura === undefined && map.tema !== undefined) {
    let gen = 0, tot = 0;
    for (let i = hdr.fila + 1; i < filas.length; i++) {
      const r = filas[i] || [];
      if (!aFecha(cel(r, 'fecha'))) continue;
      const t = String(cel(r, 'tema')).trim();
      if (!t) continue;
      tot++;
      if (TEMA_GENERICO.test(norm(t))) gen++;
    }
    temaEsAsignatura = tot > 0 && (gen / tot) < 0.5;
  }

  // si no hay columna de horas rotulada, busca una numérica plausible (ej. DCC).
  // Se excluyen las columnas de fecha y horario para no confundir "17.30" con horas.
  if (colHoras === undefined) {
    const excl = new Set([map.fecha, map.horario, map.horario + 1, map.dia]
      .filter(x => x !== undefined));
    const cand = {};
    for (let i = hdr.fila + 1; i < filas.length; i++) {
      const r = filas[i] || [];
      if (!aFecha(cel(r, 'fecha'))) continue;
      r.forEach((c, j) => {
        if (excl.has(j)) return;
        const n = num(c);
        if (n > 0 && n <= 24) cand[j] = (cand[j] || 0) + 1;
      });
    }
    const mejor = Object.entries(cand).sort((a, b) => b[1] - a[1])[0];
    if (mejor) colHoras = +mejor[0];
  }
  // si aún no hay columna de horas, se derivan del rango horario (fin − inicio).
  const derivarHoras = colHoras === undefined && map.horario !== undefined;

  for (let i = inicioLoop; i < filas.length; i++) {
    const r = filas[i] || [];
    const n = i + 1;
    const fecha = aFecha(cel(r, 'fecha'));
    const txtFecha = String(cel(r, 'fecha')).trim();
    const asigCel = String(cel(r, 'asignatura')).trim();
    const temaCel = String(cel(r, 'tema')).trim();

    // fila de módulo/bloque sin fecha: el rótulo "Módulo N" puede estar en cualquier
    // columna (a veces sin encabezado), y el nombre real va tras ':' o en la celda
    // de texto de esa misma fila. Cuando el nombre va en una celda aparte, se toma la
    // PRIMERA celda de texto a la derecha del rótulo (no la más larga), para no confundirlo
    // con rótulos de columnas contiguas ("ACTIVIDAD ACADÉMICA", "EVALUACIONES").
    if (!fecha) {
      const celdas = r.map(c => String(c == null ? '' : c).trim());
      const modIdx = celdas.findIndex(t => /^M[ÓO]DULO\b/i.test(t));
      const mod = modIdx >= 0 ? celdas[modIdx] : undefined;
      if (mod) {
        let nom = mod.includes(':') ? mod.slice(mod.indexOf(':') + 1).trim() : '';
        if (!nom) {
          const noRotulo = t => !/^(ACTIVIDAD ACAD[EÉ]MICA|EVALUACION(ES)?)$/i.test(t);
          const cand = celdas.map((t, idx) => ({ t, idx }))
            .filter(o => o.t && o.idx !== modIdx && o.t.length > 4 && !/^\d/.test(o.t) && noRotulo(o.t));
          const der = cand.filter(o => o.idx > modIdx).sort((a, b) => a.idx - b.idx);
          nom = (der[0] || cand.sort((a, b) => b.t.length - a.t.length)[0] || {}).t || '';
        }
        if (nom) tituloModulo = nom;
        seccionPend = '';
        continue;
      }
      // fila que RE-DECLARA los encabezados (DIA/FECHA/HORARIO/PROFESOR…): marca el
      // comienzo de una nueva sub-tabla (ej. "SEGUNDA SEMANA PRESENCIAL", que no trae un
      // rótulo "Módulo N"). Se reinicia el módulo vigente para que sus sesiones no se
      // sumen al módulo anterior, tomando como título la última fila de texto suelto.
      const KW = /^(DIA|FECHA|HORARIO|HORAS?|HRS\.?|TEMA|PROFESOR|DOCENTE|ASIGNATURA|SESION|MODULO|SALA|SEDE|MODALIDAD|CLASE)$/;
      if (celdas.filter(t => KW.test(norm(t))).length >= 2) {
        // Encabezado repetido (nueva sub-tabla). Si viene un rótulo de sección pendiente
        // (ej. "SEGUNDA SEMANA PRESENCIAL"), pasa a ser el módulo vigente —salvo que el
        // calendario agrupe por la columna TEMA (ej. MiMM), donde el rótulo es solo un
        // divisor. Si NO hay rótulo pendiente, se conserva el módulo vigente (que suele
        // venir declarado en la fila inmediatamente anterior al encabezado).
        if (seccionPend) tituloModulo = temaEsAsignatura ? '' : seccionPend;
        seccionPend = ''; continue;
      }
      // candidato a rótulo de sección: se recuerda por si a continuación viene una
      // cabecera repetida; si no, no tiene efecto sobre la agrupación.
      const candTit = celdas.filter(t => t.length > 4 && !/^\d/.test(t)
        && !/^M[ÓO]DULO\b/i.test(t) && !norm(t).includes('TOTAL')
        && !norm(t).includes('MASTER EN DIRECCION') && !norm(t).includes('DIPLOMA'))
        .sort((a, b) => b.length - a.length)[0];
      if (candTit) seccionPend = candTit;
      // fila de TOTAL declarado: un número suelto (en la columna de horas, o el único
      // valor numérico de la fila) sin día/asignatura/tema. Cierra el tramo y se compara
      // con la suma de horas realmente leídas desde el total anterior.
      let numTot = colHoras !== undefined ? num(r[colHoras]) : 0;
      const hayTexto = [cel(r, 'dia'), asigCel, temaCel].some(x => String(x).trim());
      if (!numTot && !hayTexto) {
        const nums = r.map(num).filter(x => x > 0);
        if (nums.length === 1) numTot = nums[0];
      }
      if (numTot > 0 && !hayTexto) {
        if (segN > 0) totales.push({ fila: n, declarado: numTot,
          leido: Math.round(segAcc * 100) / 100, sesiones: segN, desde: segIni,
          bloques: segClaves.size });
        segAcc = 0; segN = 0; segIni = 0; segClaves.clear();
        continue;
      }
      if (temaCel && !asigCel) notas.push({ fila: n, texto: temaCel });
      continue;
    }

    let horario = aHora(cel(r, 'horario'));
    // horario partido en dos columnas contiguas (inicio | término)
    if (map.horario !== undefined && /^\d{1,2}:\d{2}$/.test(horario)) {
      const sig = aHora(r[map.horario + 1]);
      if (/^\d{1,2}:\d{2}$/.test(sig)) horario = horario + ' - ' + sig;
    }
    let horas = colHoras !== undefined ? num(r[colHoras]) : 0;
    // sin columna de horas → derivarlas del rango horario (fin − inicio). Los bloques
    // largos incluyen un receso de 15 min que no cuenta como hora académica.
    if (derivarHoras) {
      const [ini, fin] = parseRangoHorario(horario);
      if (ini !== null && fin !== null && fin > ini) {
        let h = (fin - ini) / 60;
        if (fin - ini > 180) h -= 0.25;
        horas = Math.round(h * 100) / 100;
      }
    }
    if (!horas && !horario) continue;               // fila vacía / feriado

    // Nombre de la asignatura a la que pertenece la sesión, por prioridad:
    //  1) columna "Asignatura" explícita
    //  2) el MÓDULO vigente (cada módulo es una asignatura; sus sesiones —clases,
    //     examen, charla— se agrupan juntas aunque el TEMA de cada fila difiera)
    //  3) la columna TEMA, solo cuando no hay módulos y el TEMA hace de asignatura (DGN)
    // La columna "Asignatura/Módulo" a veces trae etiquetas GENÉRICAS ("Módulo 1",
    // "Taller", "Sesión 2") que no son el nombre real de la asignatura. En ese caso el
    // nombre está en el encabezado del módulo (para clases) o en el TEMA (para talleres,
    // que suelen ser una asignatura aparte).
    const sesCel0 = String(cel(r, 'sesion')).trim();
    const asigGen = /^(M[ÓO]DULO|SESI[ÓO]N|CLASE|UNIDAD|BLOQUE|TALLER)\b\s*[IVXLC\d]*$/i.test(asigCel);
    const esTaller = /^TALLER\b/i.test(asigCel) || /^TALLER\b/i.test(sesCel0);
    let principal, alt = '', temaComoNombre = false;
    if (asigCel && !asigGen) { principal = asigCel; alt = tituloModulo; }
    else if (esTaller && temaCel) { principal = temaCel; alt = tituloModulo; temaComoNombre = true; }
    else if (tituloModulo) { principal = tituloModulo; alt = (temaEsAsignatura ? temaCel : ''); }
    else if (temaEsAsignatura) { principal = temaCel; temaComoNombre = true; }
    else { principal = asigCel || ''; }
    const nombre = tituloBase(principal);
    if (!nombre) continue;
    if (alt && norm(alt) === norm(nombre)) alt = '';
    const clave = norm(nombre);
    if (!porNombre.has(clave)) {
      const b = { titulo: nombre, alt, sesiones: [], total: null, fila: n };
      porNombre.set(clave, b); bloques.push(b);
    }
    // tipo de sesión: si el TEMA es el nombre de la asignatura, se deriva de la columna
    // Sesión; en cualquier otro caso el TEMA describe el contenido/tipo de la sesión.
    const sesCel = String(cel(r, 'sesion')).trim();
    let tipo;
    if (temaComoNombre) tipo = /^EX(AMEN)?$/.test(norm(sesCel)) ? 'Examen' : (sesCel || 'Clase');
    else tipo = temaCel || 'Clase';

    porNombre.get(clave).sesiones.push({
      dia: String(cel(r, 'dia')).trim(), fecha, horario,
      tipo, temaCol: !temaComoNombre && map.tema !== undefined && !!temaCel, horas,
      docente: String(cel(r, 'profesor')).trim(), fila: n,
      sede: String(cel(r, 'sede')).trim(), sala: String(cel(r, 'sala')).trim(),
      modalidad: String(cel(r, 'modalidad')).trim(),
      sesion: String(cel(r, 'sesion')).trim(),
    });
    segAcc += horas; segN++; if (!segIni) segIni = n; segClaves.add(clave);
  }
  return { bloques: bloques.filter(b => b.sesiones.length), notas, totales, formato: 'tabular' };
}

/** Dos encabezados tienen la MISMA estructura si toda columna compartida cae en el mismo
    índice (misma disposición; encabezado simplemente repetido en cada módulo). */
function _mismaEstructura(a, b) {
  for (const k in a) if (b[k] !== undefined && b[k] !== a[k]) return false;
  for (const k in b) if (a[k] !== undefined && a[k] !== b[k]) return false;
  return true;
}

function leerCalendario(filas) {
  const hs = detectarEncabezados(filas);
  if (hs.length === 0) return leerCalendarioBloques(filas);
  if (hs.length === 1) return leerCalendarioTabular(filas, hs[0]);
  // Varios encabezados con la MISMA estructura = una sola tabla lógica con el encabezado
  // repetido en cada módulo (ej. DEC). Se lee la hoja completa desde el inicio para captar
  // el título de módulo que va sobre el primer encabezado; los encabezados repetidos y los
  // títulos de módulo se manejan dentro del lector.
  if (hs.every(h => _mismaEstructura(hs[0].map, h.map)))
    return leerCalendarioTabular(filas, hs[0], 0);
  // Varias sub-tablas con COLUMNAS DISTINTAS: se lee cada tramo con SU
  // propio encabezado y se combinan los bloques por nombre de asignatura. Así un
  // consolidado que junta el Diplomado (Año 1) y el Magíster (Año 2) en una sola hoja
  // se lee completo, sin dejar asignaturas fuera por el corrimiento de columnas.
  const porNombre = new Map(), bloques = [], notas = [], totales = [];
  for (let s = 0; s < hs.length; s++) {
    const ini = hs[s].fila, fin = (s + 1 < hs.length) ? hs[s + 1].fila : filas.length;
    const sub = filas.slice(ini, fin);
    const r = leerCalendarioTabular(sub, { fila: 0, map: hs[s].map });
    // los números de fila son relativos al tramo: se reajustan al libro completo
    r.bloques.forEach(b => b.sesiones.forEach(x => { x.fila += ini; }));
    (r.totales || []).forEach(t => { t.fila += ini; if (t.desde) t.desde += ini; });
    (r.notas || []).forEach(t => { t.fila += ini; notas.push(t); });
    (r.totales || []).forEach(t => totales.push(t));
    r.bloques.forEach(b => {
      const clave = norm(b.titulo);
      if (porNombre.has(clave)) porNombre.get(clave).sesiones.push(...b.sesiones);
      else { porNombre.set(clave, b); bloques.push(b); }
    });
  }
  return { bloques: bloques.filter(b => b.sesiones.length), notas, totales, formato: 'tabular' };
}

function leerCalendarioBloques(filas) {
  const bloques = [], notas = [], totales = [];
  let actual = null;
  filas.forEach((r0, i) => {
    const n = i + 1;
    const r = r0 || [];
    const cel = k => (r[k] == null ? '' : r[k]);
    const c0 = String(cel(0)).trim(), c1 = String(cel(1)).trim(),
          c2 = String(cel(2)).trim(), c3 = String(cel(3)).trim(), c5 = String(cel(5)).trim();
    const nota = r.slice(6).map(x => x == null ? '' : String(x).trim()).join(' ').trim();
    if (nota) notas.push({ fila: n, texto: nota });

    const esDia = DIAS.has(norm(c0));
    const fecha = aFecha(cel(1));
    const horas = num(cel(4));

    if (esDia || (fecha && horas > 0)) {
      if (!actual) { actual = { titulo: '(SIN TITULO)', sesiones: [], total: null, fila: n }; bloques.push(actual); }
      actual.sesiones.push({ dia: c0, fecha, horario: c2, tipo: c3, horas, docente: c5, fila: n });
      return;
    }
    if (!c0 && !c1 && !c2 && !c3 && horas > 0) {
      if (actual && actual.total === null) {
        actual.total = horas;
        const leido = actual.sesiones.reduce((t, s) => t + s.horas, 0);
        totales.push({ fila: n, declarado: horas, leido: Math.round(leido * 100) / 100,
          sesiones: actual.sesiones.length, titulo: actual.titulo, bloques: 1 });
      }
      return;
    }
    if (!c0 && !c1 && c2 && horas > 0) {
      if (!actual) { actual = { titulo: '(SIN TITULO)', sesiones: [], total: null, fila: n }; bloques.push(actual); }
      actual.sesiones.push({ dia: '', fecha: null, horario: c2, tipo: c3, horas, docente: c5, fila: n });
      return;
    }
    if (c0 && !c1 && !c2 && c0.length > 4) {
      const t = norm(c0);
      if (!t || t === 'TOTAL' || t.includes('MASTER EN DIRECCION') || t.includes('DIPLOMA')) return;
      actual = { titulo: c0.trim(), sesiones: [], total: null, fila: n };
      bloques.push(actual);
    }
  });
  return { bloques: bloques.filter(b => b.sesiones.length), notas, totales, formato: 'bloques' };
}

const horasProg = b => b.sesiones.reduce((t, s) => t + s.horas, 0);
const esExamen = s => TIPO_EXAMEN.some(t => String(s.tipo).toLowerCase().includes(t));
const horasClase = b => b.sesiones.filter(s => !esExamen(s)).reduce((t, s) => t + s.horas, 0);

/* --------------------------- emparejamiento ----------------------------- */
function emparejar(bloques, malla) {
  const pares = [], sinMatch = [], usados = new Set();
  const porSigla = new Map();
  malla.forEach(a => porSigla.set(norm(a.sigla), a));

  for (const b of bloques) {
    // 1) si el título trae la sigla de la malla (ej. "FIN400 Contabilidad"), gana
    const tks = norm(b.titulo).split(' ');
    let porCodigo = null;
    for (const t of tks) if (porSigla.has(t)) { porCodigo = porSigla.get(t); break; }
    if (porCodigo) {
      pares.push([b, porCodigo, 1, false]);
      usados.add(porCodigo.sigla);
      continue;
    }
    // 2) similitud de nombres; si el título propio no calza, se prueba el nombre
    //    alternativo (el módulo que contiene al bloque, o viceversa)
    let rank = malla.map(a => [similitud(b.titulo, a.nombre), a]).sort((x, y) => y[0] - x[0]);
    if (b.alt && (!rank.length || rank[0][0] < UMBRAL)) {
      const rAlt = malla.map(a => [similitud(b.alt, a.nombre), a]).sort((x, y) => y[0] - x[0]);
      if (rAlt.length && rAlt[0][0] >= UMBRAL) rank = rAlt;
    }
    const s1 = rank.length ? rank[0][0] : 0;
    const s2 = rank.length > 1 ? rank[1][0] : 0;
    const mejor = rank.length ? rank[0][1] : null;
    const sc = Math.round(s1 * 1000) / 1000;
    if (mejor && s1 >= UMBRAL) {
      pares.push([b, mejor, sc, (s1 - s2) < MARGEN_DUDA]);
      usados.add(mejor.sigla);
    } else {
      sinMatch.push([b, mejor, sc]);
    }
  }
  return { pares, sinMatch, faltantes: malla.filter(a => !usados.has(a.sigla)) };
}

/* ----------------------------- validaciones ----------------------------- */
function analizar(malla, bloques, notas, modalidad, totales) {
  const H = [];
  const add = (nivel, categoria, entidad, mensaje, recomendacion = '') =>
    H.push({ nivel, categoria, entidad, mensaje, recomendacion, modalidad });
  const { pares, sinMatch, faltantes } = emparejar(bloques, malla);

  /* 1. créditos */
  const totalCs = malla.reduce((t, a) => t + a.cs, 0);
  const esp = REGLAS.creditos_totales_esperados;
  if (esp && totalCs !== esp)
    add('CRITICO', 'Creditos', 'Programa',
      `Créditos totales de la malla (${totalCs}) ≠ aprobados (${esp}).`,
      'Revisar decreto de aprobación del plan de estudios.');
  else
    add('OK', 'Creditos', 'Programa',
      `Créditos totales de la malla: ${totalCs} (suma de ${malla.length} asignaturas).`);

  const periodos = {};
  malla.forEach(a => (periodos[a.periodo] = periodos[a.periodo] || []).push(a));
  Object.keys(periodos).sort().forEach(p => {
    const cs = periodos[p].reduce((t, x) => t + x.cs, 0);
    if (cs < REGLAS.creditos_min_periodo)
      add('ADVERTENCIA', 'Carga academica', `Periodo ${p}`,
        `Carga de ${cs} créditos, bajo el mínimo de ${REGLAS.creditos_min_periodo}.`,
        'Redistribuir asignaturas electivas hacia este período.');
    else if (cs > REGLAS.creditos_max_periodo)
      add('ADVERTENCIA', 'Carga academica', `Periodo ${p}`,
        `Carga de ${cs} créditos, sobre el máximo de ${REGLAS.creditos_max_periodo}.`,
        'Trasladar 1-2 asignaturas al período siguiente.');
    else
      add('OK', 'Carga academica', `Periodo ${p}`,
        `Carga de ${cs} créditos dentro del rango [${REGLAS.creditos_min_periodo}-${REGLAS.creditos_max_periodo}].`);
  });

  /* 2. coherencia interna */
  malla.forEach(a => {
    if (a.ha && Math.abs(a.ha - (a.hp + a.hnp)) > 0.01)
      add('CRITICO', 'Coherencia malla', `${a.sigla} ${a.nombre}`,
        `HA (${a.ha}) ≠ HP (${a.hp}) + HNP (${a.hnp}).`,
        'Corregir la distribución de horas en la malla.');
    if (a.cs && a.ha && Math.abs(a.ha / a.cs - 30) > 0.5)
      add('ADVERTENCIA', 'Coherencia malla', `${a.sigla} ${a.nombre}`,
        `Relación horas/crédito = ${(a.ha / a.cs).toFixed(1)} (esperado 30).`,
        'Verificar el estándar SCT-Chile aplicado al programa.');
  });

  /* 3. HP malla vs programado (agrupando bloques por asignatura) */
  const grupos = new Map();
  pares.forEach(([b, a, sc, dudoso]) => {
    if (!grupos.has(a.sigla)) grupos.set(a.sigla, { asig: a, bloques: [], score: sc, dudoso: false });
    const g = grupos.get(a.sigla);
    g.bloques.push(b); g.score = Math.max(g.score, sc);
    if (dudoso) g.dudoso = true;
  });

  const detalle = [];
  grupos.forEach(g => {
    const a = g.asig, bs = g.bloques;
    const ses = bs.flatMap(b => b.sesiones);
    const fechas = ses.filter(s => s.fecha).map(s => s.fecha).sort((x, y) => x - y);
    const prog = bs.reduce((t, b) => t + horasProg(b), 0);
    const delta = prog - a.hp;
    const totDec = bs.reduce((t, b) => t + (b.total || 0), 0) || null;
    const fila = {
      sigla: a.sigla, nombre: a.nombre, periodo: a.periodo, ta: a.ta, ha: a.ha, hnp: a.hnp,
      creditos: a.cs, hp_malla: a.hp, horas_programadas: prog,
      horas_clase: bs.reduce((t, b) => t + horasClase(b), 0), delta,
      total_declarado: totDec, sesiones: ses.length,
      bloque: bs.map(b => b.titulo).join(' + '), match: g.score,
      docentes: [...new Set(ses.map(s => s.docente).filter(Boolean))].sort(),
      inicio: fechas.length ? iso(fechas[0]) : null,
      fin: fechas.length ? iso(fechas[fechas.length - 1]) : null,
      modalidad, hallazgos: [],
      detalle_sesiones: ses.slice().sort((x, y) => (x.fecha || 8e15) - (y.fecha || 8e15))
        .map(s => ({ fila: s.fila, dia: s.dia, fecha: iso(s.fecha), horario: s.horario,
                     tipo: s.tipo, horas: s.horas, docente: s.docente,
                     temaCol: !!s.temaCol, sede: s.sede || '', sala: s.sala || '',
                     modalidad: s.modalidad || '', sesion: s.sesion || '' })),
    };
    if (g.dudoso) {
      add('ADVERTENCIA', 'Emparejamiento', `${a.sigla} ${a.nombre}`,
        `El bloque «${fila.bloque}» se asoció a esta asignatura con similitud ${g.score}, ` +
        `pero otra asignatura de la malla obtuvo un puntaje casi idéntico.`,
        'Confirmar manualmente a qué asignatura corresponde este bloque del calendario.');
      fila.hallazgos.push('Emparejamiento dudoso');
    }
    if (bs.length > 1) {
      add('ADVERTENCIA', 'Cobertura', `${a.sigla} ${a.nombre}`,
        `La asignatura aparece en ${bs.length} bloques separados del calendario (${bs.map(b => b.titulo).join(', ')}).`,
        'Confirmar que ambos bloques son la misma asignatura y que las horas se contabilizan una sola vez.');
      fila.hallazgos.push(`${bs.length} bloques en calendario`);
    }

    if (Math.abs(delta) > REGLAS.tolerancia_hp_horas) {
      const niv = Math.abs(delta) > 2 ? 'CRITICO' : 'ADVERTENCIA';
      const nSes = (Math.abs(delta) / 4).toFixed(1);
      add(niv, 'HP vs programado', `${a.sigla} ${a.nombre}`,
        `HP en malla = ${a.hp} h; programado en calendario = ${prog} h (diferencia ${delta > 0 ? '+' : ''}${delta} h).`,
        delta < 0 ? `Programar ${nSes} sesión(es) de 4h adicionales.` : `Eliminar/reducir ${nSes} sesión(es) de 4h.`);
      fila.hallazgos.push(`${niv}: HP ${delta > 0 ? '+' : ''}${delta} h`);
    } else {
      add('OK', 'HP vs programado', `${a.sigla} ${a.nombre}`, `HP calzan exactamente: ${a.hp} h.`);
    }

    // (la coherencia de los totales declarados vs la suma de sesiones se valida de forma
    //  global y por tramo en la sección "Integridad de horas")

    const sinDoc = ses.filter(s => !String(s.docente).trim());
    if (sinDoc.length) {
      add('CRITICO', 'Docente', `${a.sigla} ${a.nombre}`,
        `${sinDoc.length} sesión(es) sin docente asignado (fila(s) ${sinDoc.map(s => s.fila).join(', ')}).`,
        'Asignar docente responsable antes del inicio del período.');
      fila.hallazgos.push(`${sinDoc.length} sesión(es) sin docente`);
    }

    const sinFecha = ses.filter(s => !s.fecha);
    if (sinFecha.length) {
      add('CRITICO', 'Fecha', `${a.sigla} ${a.nombre}`,
        `${sinFecha.length} sesión(es) sin fecha definida (fila(s) ${sinFecha.map(s => s.fila).join(', ')}).`,
        'Calendarizar las sesiones pendientes.');
      fila.hallazgos.push(`${sinFecha.length} sesión(es) sin fecha`);
    }

    const clases = ses.filter(s => s.fecha && !esExamen(s));
    const exams = ses.filter(s => s.fecha && esExamen(s));
    if (clases.length && exams.length) {
      const ult = new Date(Math.max(...clases.map(s => s.fecha)));
      exams.forEach(e => {
        if (e.fecha < ult) {
          add('CRITICO', 'Secuencia', `${a.sigla} ${a.nombre}`,
            `Examen el ${dmy(e.fecha)} ocurre ANTES de la última clase (${dmy(ult)}).`,
            `Reprogramar el examen a una fecha posterior al ${dmy(ult)}.`);
          fila.hallazgos.push('Examen antes de la última clase');
        }
      });
    }

    ses.forEach(s => {
      if (s.fecha && DIAS.has(norm(s.dia))) {
        const real = DIAS_ORDEN[(s.fecha.getDay() + 6) % 7];
        if (real !== norm(s.dia)) {
          add('CRITICO', 'Fecha', `${a.sigla} ${a.nombre}`,
            `Fila ${s.fila}: se declara '${s.dia}' pero ${dmy(s.fecha)} es ${real[0] + real.slice(1).toLowerCase()}.`,
            `Corregir la fecha o el día. El ${real.toLowerCase()} más cercano es ${diaCercano(s.fecha, norm(s.dia))}.`);
          fila.hallazgos.push('Día/fecha inconsistente');
        }
      }
    });

    ses.forEach(s => {
      const [i0, f0] = parseRangoHorario(s.horario);
      if (i0 !== null && f0 !== null && f0 <= i0) {
        add('CRITICO', 'Horario', `${a.sigla} ${a.nombre}`,
          `Rango horario inválido '${s.horario}' (fila ${s.fila}, ${dmy(s.fecha)}).`,
          'Corregir hora de inicio/término.');
        fila.hallazgos.push('Rango horario inválido');
      }
    });

    detalle.push(fila);
  });

  /* 4. asignaturas sin calendario */
  faltantes.forEach(a => {
    add('CRITICO', 'Cobertura', `${a.sigla} ${a.nombre}`,
      `Asignatura de la malla (período ${a.periodo}, ${a.cs} cr, ${a.hp} HP) sin bloque en el calendario ${modalidad}.`,
      'Calendarizar la asignatura o justificar su exclusión del período.');
    detalle.push({
      sigla: a.sigla, nombre: a.nombre, periodo: a.periodo, ta: a.ta, ha: a.ha, hnp: a.hnp,
      creditos: a.cs, hp_malla: a.hp, horas_programadas: 0, horas_clase: 0, delta: -a.hp,
      total_declarado: null, sesiones: 0, bloque: '(NO CALENDARIZADA)', match: 0,
      docentes: [], inicio: null, fin: null, modalidad,
      hallazgos: ['CRITICO: sin calendario'], detalle_sesiones: [],
    });
  });

  /* 4b. Cross-check de integridad: los totales declarados en el calendario (las filas
     con el número de horas del módulo) deben coincidir con la suma de las sesiones que
     el lector agrupó en ese tramo. Detecta automáticamente sesiones perdidas, duplicadas
     o mal leídas, sin depender de la malla. */
  let totOK = 0, totMal = 0;
  (totales || []).forEach(t => {
    const calza = Math.abs(t.declarado - t.leido) < 0.01;
    if (calza) { totOK++; return; }
    // Solo se marca cuando el total corresponde a UNA asignatura (señal inequívoca de
    // lectura). Si el tramo mezcla varias asignaturas y no calza, el total podría ser
    // parcial (cubre solo un módulo del tramo), así que no se marca para no dar falsos
    // positivos.
    if ((t.bloques || 1) > 1) return;
    totMal++;
    const ent = t.titulo ? t.titulo : (t.desde ? `tramo desde fila ${t.desde}` : `fila ${t.fila}`);
    add('CRITICO', 'Integridad de horas', ent,
      `El total declarado en el calendario (fila ${t.fila}) dice ${t.declarado} h, pero la ` +
      `suma de las ${t.sesiones} sesión(es) leídas en ese tramo es ${t.leido} h ` +
      `(diferencia ${(t.leido - t.declarado > 0 ? '+' : '')}${Math.round((t.leido - t.declarado) * 100) / 100} h).`,
      'Revisar el calendario: puede haber una sesión sin registrar, una fila repetida o una ' +
      'celda de horas mal escrita en ese tramo.');
  });
  if (totales && totales.length && !totMal)
    add('OK', 'Integridad de horas', 'Calendario',
      `Los ${totOK} total(es) declarado(s) coinciden con la suma de sus sesiones.`);

  /* 5. bloques fuera de malla */
  const extras = [];
  sinMatch.forEach(([b, mejor, sc]) => {
    add('ADVERTENCIA', 'Fuera de malla', b.titulo,
      `Bloque de ${horasProg(b)} h en el calendario sin asignatura equivalente en la malla ` +
      `(mejor candidato: ${mejor ? mejor.nombre : 'ninguno'}, similitud ${sc}).`,
      'Registrar como actividad extracurricular o incorporar a la malla.');
    // se conserva para el reporte operativo, aunque no compute en el cumplimiento
    const fechasB = b.sesiones.filter(s => s.fecha).map(s => s.fecha).sort((x, y) => x - y);
    extras.push({
      sigla: '', nombre: b.titulo, periodo: '', ta: '', ha: '', hnp: '',
      creditos: '', hp_malla: '', horas_programadas: horasProg(b),
      sesiones: b.sesiones.length, fuera_de_malla: true, modalidad,
      inicio: fechasB.length ? iso(fechasB[0]) : null,
      fin: fechasB.length ? iso(fechasB[fechasB.length - 1]) : null,
      docentes: [...new Set(b.sesiones.map(s => s.docente).filter(Boolean))].sort(),
      hallazgos: ['Fuera de malla'],
      detalle_sesiones: b.sesiones.slice()
        .sort((x, y) => (x.fecha || 8e15) - (y.fecha || 8e15))
        .map(s => ({ fila: s.fila, dia: s.dia, fecha: iso(s.fecha), horario: s.horario,
                     tipo: s.tipo, horas: s.horas, docente: s.docente,
                     temaCol: !!s.temaCol, sede: s.sede || '', sala: s.sala || '',
                     modalidad: s.modalidad || '', sesion: s.sesion || '' })),
    });
  });

  /* 6. solapamientos */
  const todos = [];
  bloques.forEach(b => b.sesiones.forEach(s => { if (s.fecha) todos.push([b, s]); }));
  const porFecha = new Map();
  todos.forEach(([b, s]) => {
    const k = iso(s.fecha);
    if (!porFecha.has(k)) porFecha.set(k, []);
    porFecha.get(k).push([b, s]);
  });
  let solapes = 0;
  porFecha.forEach((items, f) => {
    for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
      const [b1, s1] = items[i], [b2, s2] = items[j];
      if (b1 === b2) continue;
      const [a1, f1] = parseRangoHorario(s1.horario), [a2, f2] = parseRangoHorario(s2.horario);
      if ([a1, f1, a2, f2].some(x => x === null)) continue;
      if (a1 < f2 && a2 < f1) {
        solapes++;
        add('CRITICO', 'Solapamiento', `${b1.titulo} / ${b2.titulo}`,
          `${f}: '${s1.horario}' (${b1.titulo}) se cruza con '${s2.horario}' (${b2.titulo}).`,
          'Mover una de las sesiones a otra franja u otra fecha.');
      }
    }
  });
  if (!solapes) add('OK', 'Solapamiento', 'Calendario', 'No se detectaron cruces de horario entre asignaturas.');

  /* 7-8. vacíos y duración */
  const fechas = [...new Set(todos.map(([, s]) => +s.fecha))].sort((a, b) => a - b).map(t => new Date(t));
  let sem = {};
  if (fechas.length) {
    for (let i = 1; i < fechas.length; i++) {
      const d = dias(fechas[i - 1], fechas[i]);
      if (d >= REGLAS.gap_critico_dias)
        add('ADVERTENCIA', 'Vacio academico', 'Calendario',
          `${d} días sin actividad entre ${dmy(fechas[i - 1])} y ${dmy(fechas[i])}.`,
          'Verificar si corresponde a receso oficial; documentarlo en el calendario.');
      else if (d >= REGLAS.gap_alerta_dias)
        add('ADVERTENCIA', 'Vacio academico', 'Calendario',
          `${d} días sin actividad entre ${dmy(fechas[i - 1])} y ${dmy(fechas[i])}.`,
          'Revisar continuidad académica.');
    }
    const f0 = fechas[0], f1 = fechas[fechas.length - 1];
    const meses = (f1.getFullYear() - f0.getFullYear()) * 12 + f1.getMonth() - f0.getMonth();
    if (meses > REGLAS.duracion_max_meses)
      add('CRITICO', 'Duracion', 'Programa',
        `Duración de ${meses} meses (${dmy(f0)} a ${dmy(f1)}), sobre el máximo de ${REGLAS.duracion_max_meses} meses.`,
        'Compactar el calendario o solicitar autorización de extensión.');
    else if (meses < REGLAS.duracion_min_meses)
      add('ADVERTENCIA', 'Duracion', 'Programa',
        `Duración de ${meses} meses, bajo el mínimo referencial de ${REGLAS.duracion_min_meses} meses.`,
        'Verificar normativa de posgrado.');
    else
      add('OK', 'Duracion', 'Programa', `Duración de ${meses} meses (${dmy(f0)} a ${dmy(f1)}), dentro de norma.`);

    todos.forEach(([, s]) => {
      const k = `${s.fecha.getFullYear()}-S${s.fecha.getMonth() <= 5 ? 1 : 2}`;
      sem[k] = (sem[k] || 0) + s.horas;
    });
  }

  /* 9. carga docente */
  const docDia = new Map();
  todos.forEach(([b, s]) => {
    if (!s.docente) return;
    const k = s.docente + '|' + iso(s.fecha);
    if (!docDia.has(k)) docDia.set(k, []);
    docDia.get(k).push([b, s]);
  });
  docDia.forEach((items, k) => {
    if (new Set(items.map(([b]) => b)).size > 1) {
      const [d, f] = k.split('|');
      add('ADVERTENCIA', 'Carga docente', d,
        `${d} dicta ${items.length} sesiones de asignaturas distintas el ${f}.`,
        'Confirmar disponibilidad del docente o redistribuir.');
    }
  });

  const resumen = {
    modalidad, asignaturas_malla: malla.length, creditos_totales: totalCs,
    horas_malla_hp: malla.reduce((t, a) => t + a.hp, 0),
    horas_programadas: bloques.reduce((t, b) => t + horasProg(b), 0),
    bloques_calendario: bloques.length, emparejadas: grupos.size,
    sin_calendario: faltantes.length, fuera_de_malla: sinMatch.length,
    inicio: fechas.length ? iso(fechas[0]) : null,
    fin: fechas.length ? iso(fechas[fechas.length - 1]) : null,
    carga_por_semestre: sem, notas_calendario: notas,
  };
  return { hallazgos: H, detalle, resumen, extras };
}

/* -------------------------- resumen ejecutivo --------------------------- */
const VERDE = '🟢 CUMPLIDO', AMARILLO = '🟡 DESVIACIÓN', ROJO = '🔴 CRÍTICO';

function resumenEjecutivo(malla, modalidades) {
  const cols = modalidades.map(m => m.modalidad);
  const dets = {};
  modalidades.forEach(m => {
    dets[m.modalidad] = {};
    m.detalle.forEach(d => (dets[m.modalidad][d.sigla] = d));
  });
  const filas = [];
  const fila = (indicador, malla_base, valores, estado, observacion, detalle = []) =>
    filas.push({ indicador, malla_base, valores, estado, observacion, detalle });

  const cs = malla.reduce((t, a) => t + a.cs, 0), ha = malla.reduce((t, a) => t + a.ha, 0);
  const hp = malla.reduce((t, a) => t + a.hp, 0), hnp = malla.reduce((t, a) => t + a.hnp, 0);
  const rep = v => { const o = {}; cols.forEach(c => (o[c] = v)); return o; };

  // agrupación por período (para detalles estructurales)
  const periodos = {};
  malla.forEach(a => (periodos[a.periodo] = periodos[a.periodo] || []).push(a));
  // líneas de detalle a partir de hallazgos de ciertas categorías, por modalidad
  const linsHall = (cats) => {
    const out = [];
    modalidades.forEach(m => {
      const hs = m.hallazgos.filter(h => cats.includes(h.categoria) && h.nivel !== 'OK');
      if (!hs.length) out.push({ mod: m.modalidad, txt: 'sin observaciones' });
      else hs.forEach(h => out.push({ mod: m.modalidad, txt: `${h.entidad} — ${h.mensaje}`, rec: h.recomendacion }));
    });
    return out;
  };

  fila('Total Créditos SCT', `${cs}`, rep(`${cs}`), VERDE,
    `${cs} créditos en ${malla.length} asignaturas. Verificar contra el decreto de aprobación del plan.`,
    Object.keys(periodos).sort().map(p => {
      const a = periodos[p];
      return { txt: `Período ${p}: ${a.reduce((t, x) => t + x.cs, 0)} créditos en ${a.length} asignaturas` };
    }));

  fila('Total Horas Académicas (HA)', `${ha}`, rep(`${ha}`), VERDE,
    `${ha} HA totales = ${hp} HP + ${hnp} HNP. Coherencia interna correcta.`,
    [{ txt: `Horas presenciales (HP): ${hp} h` },
     { txt: `Horas no presenciales (HNP): ${hnp} h` },
     { txt: `Estándar SCT-Chile aplicado: 30 horas académicas por crédito` },
     ...Object.keys(periodos).sort().map(p => ({
       txt: `Período ${p}: ${periodos[p].reduce((t, x) => t + x.ha, 0)} HA`
     }))]);

  const ta = {};
  malla.forEach(a => { const k = a.ta || 'SIN TA'; ta[k] = (ta[k] || 0) + 1; });
  Object.keys(ta).sort().forEach(tipo => {
    const lista = malla.filter(a => (a.ta || 'SIN TA') === tipo);
    fila(`Asignaturas Tipo ${tipo}`, String(ta[tipo]), rep(String(ta[tipo])),
      tipo === 'REGULAR' ? VERDE : AMARILLO,
      tipo === 'REGULAR' ? 'Cursos teóricos/prácticos regulares del plan.'
        : `Corresponde a ${lista.map(a => a.sigla).join(', ')}. Actividad de titulación: validar registro de horas por separado.`,
      lista.map(a => ({ txt: `${a.sigla} — ${a.nombre} (${a.cs} cr · ${a.hp} HP · período ${a.periodo})` })));
  });

  const hpProg = {}, dif = {};
  cols.forEach(c => {
    hpProg[c] = Object.values(dets[c]).reduce((t, d) => t + d.horas_programadas, 0);
    dif[c] = hpProg[c] - hp;
  });
  const vHp = {}; cols.forEach(c => (vHp[c] = `${hpProg[c]} (${dif[c] > 0 ? '+' : ''}${dif[c]})`));
  const detHp = [];
  cols.forEach(c => {
    detHp.push({ mod: c, txt: `HP malla ${hp} h vs programado ${hpProg[c]} h (diferencia ${dif[c] > 0 ? '+' : ''}${dif[c]} h)` });
    Object.values(dets[c]).filter(x => x.delta !== 0).forEach(x =>
      detHp.push({ txt: `   • ${x.sigla} ${x.nombre}: ${x.horas_programadas} h prog. vs ${x.hp_malla} HP (${x.delta > 0 ? '+' : ''}${x.delta} h)` }));
  });
  fila('Total Horas Presenciales (HP)', `${hp}`, vHp,
    cols.every(c => dif[c] === 0) ? VERDE : AMARILLO,
    'Diferencia neta entre HP exigidas por la malla y HP efectivamente calendarizadas.', detHp);

  const regs = malla.filter(a => a.ta === 'REGULAR');
  const calce = {};
  cols.forEach(c => {
    const ok = regs.filter(a => dets[c][a.sigla] && dets[c][a.sigla].delta === 0).length;
    calce[c] = `${ok} de ${regs.length} (${Math.round(100 * ok / Math.max(1, regs.length))}%)`;
  });
  const detCalce = [];
  cols.forEach(c => {
    const noCalza = regs.filter(a => dets[c][a.sigla] && dets[c][a.sigla].delta !== 0);
    if (!noCalza.length) detCalce.push({ mod: c, txt: 'todos los cursos regulares calzan exactamente' });
    else noCalza.forEach(a => {
      const d = dets[c][a.sigla];
      detCalce.push({ mod: c, txt: `${a.sigla} ${a.nombre}: ${d.horas_programadas} h vs ${a.hp} HP (${d.delta > 0 ? '+' : ''}${d.delta} h)` });
    });
  });
  fila('Calce exacto HP en cursos REGULAR', `${regs.length} cursos`, calce,
    cols.every(c => calce[c].startsWith(String(regs.length))) ? VERDE : AMARILLO,
    'Asignaturas regulares cuyas horas programadas coinciden exactamente con las HP de la malla.', detCalce);

  const desv = {};
  const detDesv = [];
  cols.forEach(c => {
    const d = Object.values(dets[c]).filter(x => x.delta !== 0);
    desv[c] = d.length ? d.map(x => `${x.sigla} (${x.delta > 0 ? '+' : ''}${x.delta}h)`).join(', ') : 'ninguna';
    if (!d.length) detDesv.push({ mod: c, txt: 'sin desviaciones' });
    else d.forEach(x => detDesv.push({ mod: c,
      txt: `${x.sigla} ${x.nombre} (período ${x.periodo}): ${x.horas_programadas} h prog. vs ${x.hp_malla} HP (${x.delta > 0 ? '+' : ''}${x.delta} h)`,
      rec: x.delta < 0 ? `faltan ${-x.delta} h por programar` : `sobran ${x.delta} h respecto de la malla` }));
  });
  fila('Asignaturas con desviación de HP', '—', desv,
    cols.some(c => desv[c] !== 'ninguna') ? ROJO : VERDE,
    'Detalle de cada asignatura cuyas horas programadas no calzan con la malla.', detDesv);

  const cob = {};
  const detCob = [];
  cols.forEach(c => {
    const faltan = Object.values(dets[c]).filter(x => x.sesiones === 0);
    cob[c] = `${Object.keys(dets[c]).length - faltan.length} de ${malla.length}`;
    if (!faltan.length) detCob.push({ mod: c, txt: 'todas las asignaturas están calendarizadas' });
    else faltan.forEach(x => detCob.push({ mod: c, txt: `${x.sigla} ${x.nombre} (período ${x.periodo}): sin sesiones en el calendario` }));
  });
  fila('Cobertura de calendarización', `${malla.length} asignaturas`, cob,
    cols.every(c => cob[c] === `${malla.length} de ${malla.length}`) ? VERDE : ROJO,
    'Asignaturas de la malla con al menos una sesión programada en el calendario.', detCob);

  [['Sesiones sin docente asignado', ['Docente'], 'Sesiones calendarizadas sin responsable académico designado.'],
   ['Inconsistencias de fecha', ['Fecha'], 'Sesiones sin fecha, más casos en que el día declarado no corresponde al día real.'],
   ['Exámenes fuera de secuencia', ['Secuencia'], 'Evaluaciones programadas antes de la última clase de la asignatura.'],
   ['Cruces de horario', ['Solapamiento'], 'Sesiones de asignaturas distintas superpuestas en la misma franja.'],
  ].forEach(([et, cats, obs]) => {
    const vals = {}; let peor = VERDE;
    modalidades.forEach(m => {
      const n = m.hallazgos.filter(h => cats.includes(h.categoria) && h.nivel !== 'OK').length;
      vals[m.modalidad] = String(n);
      if (n) peor = ROJO;
    });
    fila(et, '—', vals, peor, obs, linsHall(cats));
  });

  const vent = {}, dur = {};
  const detVent = [], detDur = [];
  modalidades.forEach(m => {
    vent[m.modalidad] = `${dmy(m.resumen.inicio)} → ${dmy(m.resumen.fin)}`;
    const d = m.hallazgos.filter(h => h.categoria === 'Duracion');
    dur[m.modalidad] = d.length ? (d[0].mensaje.split(' de ')[1] || '').split(' (')[0] : '—';
    detVent.push({ mod: m.modalidad, txt: `del ${dmy(m.resumen.inicio)} al ${dmy(m.resumen.fin)}` });
    Object.entries(m.resumen.carga_por_semestre).sort().forEach(([k, v]) =>
      detVent.push({ txt: `   • ${k}: ${v} h presenciales` }));
    if (d.length) detDur.push({ mod: m.modalidad, txt: d[0].mensaje });
  });
  fila('Ventana académica', '—', vent, VERDE, 'Fecha de la primera y última actividad programada.', detVent);
  fila('Duración del programa', `máx. ${REGLAS.duracion_max_meses} meses`, dur, VERDE,
    'Duración total según el calendario, contra la norma de posgrado.', detDur);

  return { columnas: cols, filas };
}

/* ------------------- reporte de programación (operativo) ---------------- */
const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio',
  'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const cap = s => s ? s[0].toUpperCase() + s.slice(1).toLowerCase() : '';
const REPORTE_COLS = ['PROGRAMA', 'NOMBRE ABREVIADO', 'Nº ALUMNOS', 'AÑO IMPARTE',
  'SIGLA', 'ASIGNATURA', 'FECHAS', 'DIA SEMANA', 'MES', 'HORARIO', 'TEMA', 'PROFESOR',
  'HORAS', 'MODALIDAD', 'SEDE', 'SALA', 'COORDINADORA RESPONSABLE'];

const PARTICULAS = new Set(['DE', 'DEL', 'LA', 'LAS', 'LOS', 'Y', 'EN', 'PARA', 'EL', 'AL']);
const ESTADO_RE = /\(\s*(confirmad[oa]s?|por\s+confirmar|sin\s+confirmar|pendiente|ok)\b[^)]*\)/gi;

/** ¿El texto parece un nombre de persona (2-4 palabras capitalizadas, sin partículas)? */
function esNombrePersona(s) {
  const t = String(s || '').trim();
  if (!t || /\d/.test(t)) return false;
  const w = t.split(/\s+/);
  if (w.length < 2 || w.length > 4) return false;
  return w.every(x => {
    const n = norm(x);
    if (PARTICULAS.has(n)) return false;
    return x[0] === x[0].toUpperCase() && x[0] !== x[0].toLowerCase();
  });
}

/** Separa 'Finanzas Sostenibles (German Heufeman)' o 'Hugo Caneo(Mercado de Valores)'
    en {tema, profesor}, descartando marcas de estado como '(CONFIRMADO)'. */
function parseDocenteTema(docente) {
  let t = String(docente || '').replace(ESTADO_RE, ' ').replace(/\s+/g, ' ').trim();
  t = t.replace(/[\s,;-]+$/, '');
  const m = /^(.*?)\s*\(([^)]+)\)\s*$/.exec(t);
  if (!m || !m[1].trim()) return { tema: '', profesor: t };
  const fuera = m[1].trim(), dentro = m[2].trim();
  if (esNombrePersona(dentro)) return { tema: fuera, profesor: dentro };
  if (esNombrePersona(fuera)) return { tema: dentro, profesor: fuera };
  return { tema: dentro, profesor: fuera };
}

/** Aplana todas las sesiones de todos los calendarios al formato del reporte. */
function reporteProgramacion(datos, meta) {
  meta = meta || {};
  const rows = [];
  datos.modalidades.forEach(m => {
    // incluye asignaturas de la malla y bloques fuera de malla (estos, sin sigla)
    m.detalle.concat(m.extras || []).forEach(d => {
      (d.detalle_sesiones || []).forEach(s => {
        const f = s.fecha ? new Date(s.fecha + 'T00:00:00') : null;
        const pt = parseDocenteTema(s.docente);
        rows.push({
          'PROGRAMA': meta.programa || datos.programa,
          'NOMBRE ABREVIADO': meta.abrev || datos.programa,
          'Nº ALUMNOS': meta.alumnos || '',
          'AÑO IMPARTE': f ? f.getFullYear() : '',
          'SIGLA': d.sigla,
          'ASIGNATURA': d.nombre,
          'FECHAS': s.fecha || '',
          'DIA SEMANA': f ? cap(DIAS_ORDEN[(f.getDay() + 6) % 7]) : cap(s.dia),
          'MES': f ? MESES[f.getMonth()] : '',
          'HORARIO': s.horario || '',
          'TEMA': s.temaCol ? s.tipo : (pt.tema || cap(s.tipo) || ''),
          'PROFESOR': pt.profesor,
          'HORAS': s.horas,
          'MODALIDAD': s.modalidad || m.modalidad,
          'SEDE': s.sede || meta.sede || '',
          'SALA': s.sala || '',
          'COORDINADORA RESPONSABLE': meta.coordinadora || '',
          _f: f ? f.getTime() : 0, _m: m.modalidad,
        });
      });
    });
  });
  rows.sort((a, b) => a._m.localeCompare(b._m) || a._f - b._f);
  rows.forEach(r => { delete r._f; delete r._m; });
  return rows;
}

/* ==================== fichas financieras (FF) =========================== */
/* Lee el calculador de devengos/vencimientos (hoja "Programas") y rellena la
   plantilla oficial de Ficha Financiera conservando su formato (edición del XML). */

function leerCalculador(hojas) {
  // hoja "Programas": encabezado en la fila con "N° DEVENGOS" y "N° VENCIMIENTOS"
  const hoja = hojas.find(h => /PROGRAMAS?/.test(norm(h.nombre))) || hojas[0];
  const filas = hoja.filas;
  let hi = -1, map = {};
  for (let i = 0; i < Math.min(12, filas.length); i++) {
    const r = (filas[i] || []).map(norm);
    const idx = {};
    r.forEach((t, j) => {
      if (/NOMBRE DEL PROGRAMA|^NOMBRE PROGRAMA/.test(t) && idx.nombre === undefined) idx.nombre = j;
      else if (/FECHA INICIO/.test(t) && idx.inicio === undefined) idx.inicio = j;
      else if (/FECHA TERMINO|FECHA TÉRMINO/.test(t) && idx.termino === undefined) idx.termino = j;
      else if (/N\s*DEVENGOS|NUMERO DE DEVENGOS/.test(t) && idx.nDev === undefined) idx.nDev = j;
      else if (/MESES DEVENGOS/.test(t) && idx.mesesDev === undefined) idx.mesesDev = j;
      else if (/N\s*VENCIMIENTOS|NUMERO DE VENCIMIENTOS/.test(t) && idx.nVenc === undefined) idx.nVenc = j;
      else if (/MESES VENCIMIENTOS/.test(t) && idx.mesesVenc === undefined) idx.mesesVenc = j;
    });
    if (idx.nombre !== undefined && idx.nDev !== undefined && idx.nVenc !== undefined) { hi = i; map = idx; break; }
  }
  if (hi < 0) return null;
  const g = (r, k) => (map[k] !== undefined && r[map[k]] != null) ? r[map[k]] : '';
  const out = [];
  for (let i = hi + 1; i < filas.length; i++) {
    const r = filas[i] || [];
    const nombre = String(g(r, 'nombre')).trim();
    if (!nombre) continue;
    const nDev = g(r, 'nDev'), nVenc = g(r, 'nVenc');
    if (nDev === '' && nVenc === '') continue;   // fila sin cálculo
    out.push({
      nombre, inicio: aFecha(g(r, 'inicio')), termino: aFecha(g(r, 'termino')),
      nDev: num(nDev), nVenc: num(nVenc),
      mesesDev: String(g(r, 'mesesDev')).trim(), mesesVenc: String(g(r, 'mesesVenc')).trim(),
    });
  }
  return out;
}

/** Lee la tabla maestra "formato_FF_..._COMPLETAR" (hoja Hoja1): una fila por programa
    con TODOS los campos de la ficha. Devuelve null si el archivo no tiene ese formato. */
function leerCompletarFF(hojas) {
  const COLS = {
    nombre: /NOMBRE PROGRAMA/, sigla: /SIGLA DEL PROGRAMA|^SIGLA$/, formato: /^FORMATO/,
    continuacion: /CONTINUACION|CONTINUACIÓN/, facultad: /^FACULTAD/, subarea: /SUB ?AREA/,
    subtipo: /SUBTIPO/, tipoPrograma: /TIPO DE PROGRAMA/, tipoVenta: /TIPO DE VENTA/,
    tipoDocencia: /TIPO DOCENCIA/, link: /LINK COHORTE/, nCohorte: /N[UÚ]MERO DE COHORTE/,
    inicio: /FECHA INICIO/, termino: /FECHA T[EÉ]RMINO/, coordinador: /^COORDINADOR/,
    director: /DIRECTOR/, definicionUso: /DEFINICION DE USO|DEFINICIÓN DE USO/,
    codigoSence: /C[OÓ]DIGO SENCE/, horasCron: /HORAS CRONOL/, solicitante: /SOLICITANTE/,
    aprobador: /APROBADOR/, monedaPost: /MONEDA POSTULACI/, valorPost: /VALOR POSTULACI/,
    monedaMat: /MONEDA MATR[IÍ]CULA/, valorMat: /VALOR MATR[IÍ]CULA/,
    monedaAra: /MONEDA ARANCEL/, valorAra: /VALOR ARANCEL/,
    nDev: /N[UÚ]MERO DE DEVENGOS/, mesesDev: /MESES DEVENGOS/,
    nVenc: /N[UÚ]MERO DE VENCIMIENTOS/, mesesVenc: /MESES VENCIMIENTOS/,
  };
  const hoja = hojas.find(h => (h.filas[0] || []).some(c => /SIGLA DEL PROGRAMA/.test(norm(c)))
    && (h.filas[0] || []).some(c => /FACULTAD/.test(norm(c)))) || null;
  if (!hoja) return null;
  const hdr = (hoja.filas[0] || []).map(norm);
  const map = {};
  Object.keys(COLS).forEach(k => { const j = hdr.findIndex(t => COLS[k].test(t)); if (j >= 0) map[k] = j; });
  if (map.nombre === undefined) return null;
  const g = (r, k) => (map[k] !== undefined && r[map[k]] != null) ? r[map[k]] : '';
  const out = [];
  for (let i = 1; i < hoja.filas.length; i++) {
    const r = hoja.filas[i] || [];
    const nombre = String(g(r, 'nombre')).trim();
    if (!nombre) continue;
    const sigla = String(g(r, 'sigla')).trim();
    const formato = String(g(r, 'formato')).trim();
    const cont = /^S/i.test(String(g(r, 'continuacion')).trim());
    const anio = aFecha(g(r, 'inicio')) ? aFecha(g(r, 'inicio')).getFullYear() : 2027;
    const siglaCC = [sigla, formato, anio].filter(Boolean).join(' ') + (cont ? ' CONT' : '');
    out.push({
      _completo: true, nombre, sigla, siglaCC,
      facultad: String(g(r, 'facultad')).trim(), subarea: String(g(r, 'subarea')).trim(),
      subtipo: String(g(r, 'subtipo')).trim(), tipoPrograma: String(g(r, 'tipoPrograma')).trim(),
      tipoVenta: String(g(r, 'tipoVenta')).trim(), tipoDocencia: String(g(r, 'tipoDocencia')).trim(),
      link: String(g(r, 'link')).trim(), nCohorte: g(r, 'nCohorte'),
      inicio: aFecha(g(r, 'inicio')), termino: aFecha(g(r, 'termino')),
      coordinador: String(g(r, 'coordinador')).trim(), director: String(g(r, 'director')).trim(),
      definicionUso: String(g(r, 'definicionUso')).trim(), codigoSence: g(r, 'codigoSence'),
      horasCron: g(r, 'horasCron'), solicitante: String(g(r, 'solicitante')).trim(),
      aprobador: String(g(r, 'aprobador')).trim(),
      monedaPost: String(g(r, 'monedaPost')).trim(), valorPost: g(r, 'valorPost'),
      monedaMat: String(g(r, 'monedaMat')).trim(), valorMat: g(r, 'valorMat'),
      monedaAra: String(g(r, 'monedaAra')).trim(), valorAra: g(r, 'valorAra'),
      nDev: num(g(r, 'nDev')), mesesDev: String(g(r, 'mesesDev')).trim(),
      nVenc: num(g(r, 'nVenc')), mesesVenc: String(g(r, 'mesesVenc')).trim(),
    });
  }
  return out;
}

const _escXml = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/** Deriva una sigla a partir del nombre del programa (iniciales de las palabras
    significativas). Aproximada y editable: p. ej. "Magíster en Innovación" → "MI",
    "Diplomado en Negocios e Inteligencia Artificial" → "DNIA". */
const _STOPSIG = new Set(['EN', 'DE', 'DEL', 'LA', 'EL', 'LOS', 'LAS', 'Y', 'E', 'PARA',
  'POR', 'CON', 'A', 'AL', 'IN', 'THE', 'OF']);
function derivarSigla(nombre) {
  const n = norm(String(nombre || '').replace(/\(.*?\)/g, ' '));
  const ws = n.split(' ').filter(w => w && !_STOPSIG.has(w) && w.length > 1);
  return ws.map(w => w[0]).join('').slice(0, 6);
}
const _serialFecha = d => {
  if (!d) return null;
  const y = d.getFullYear(), m = d.getMonth() + 1, dd = d.getDate();
  return Math.round(Date.UTC(y, m - 1, dd) / 86400000) + 25569;
};

/** Reemplaza el valor de una celda conservando su estilo (atributo s=""). */
function _setCell(xml, ref, spec) {
  const re = new RegExp('<c r="' + ref + '"([^>]*?)(?:/>|>[\\s\\S]*?</c>)');
  const mm = xml.match(re);
  const s = mm ? (mm[1].match(/ s="(\d+)"/) || [])[1] : undefined;
  const sAttr = s !== undefined ? (' s="' + s + '"') : '';
  let cell;
  if (spec.blank) cell = '<c r="' + ref + '"' + sAttr + '/>';
  else if (spec.tipo === 'n' || spec.tipo === 'date') cell = '<c r="' + ref + '"' + sAttr + '><v>' + spec.valor + '</v></c>';
  else cell = '<c r="' + ref + '"' + sAttr + ' t="inlineStr"><is><t xml:space="preserve">' + _escXml(spec.valor) + '</t></is></c>';
  if (mm) return xml.replace(re, cell);
  const rowN = ref.match(/\d+/)[0];
  const rre = new RegExp('(<row r="' + rowN + '"[^>]*>)([\\s\\S]*?)(</row>)');
  if (rre.test(xml)) return xml.replace(rre, (a, o, c, cl) => o + c + cell + cl);
  return xml;
}

/** Ruta del XML de una hoja, resolviendo por nombre (o un selector) de forma robusta
    ante distintos órdenes de atributos (Excel vs openpyxl). */
function _hojaPath(files, pick) {
  const wb = fflate.strFromU8(files['xl/workbook.xml']);
  const sheets = wb.match(/<sheet\b[^>]*\/?>/g) || [];
  let rid = null;
  for (const s of sheets) {
    const nm = (s.match(/name="([^"]*)"/) || [])[1] || '';
    if (pick(nm)) { rid = (s.match(/r:id="([^"]+)"/) || [])[1]; break; }
  }
  if (!rid && sheets.length) rid = (sheets[0].match(/r:id="([^"]+)"/) || [])[1];
  const rels = fflate.strFromU8(files['xl/_rels/workbook.xml.rels']);
  const rel = (rels.match(/<Relationship\b[^>]*\/?>/g) || []).find(r => r.includes('Id="' + rid + '"'));
  const tgt = (rel.match(/Target="([^"]+)"/) || [])[1].replace(/^\//, '').replace(/^xl\//, '');
  return 'xl/' + tgt;
}

/** Rellena una plantilla .xlsx aplicando `aplicar(xml)` sobre la hoja elegida por
    `pick(nombre)`, conservando todo el formato. Devuelve Uint8Array del .xlsx. */
function _llenarPlantilla(templateBytes, pick, aplicar) {
  const files = fflate.unzipSync(templateBytes);
  const path = _hojaPath(files, pick);
  files[path] = fflate.strToU8(aplicar(fflate.strFromU8(files[path]), files));
  return fflate.zipSync(files, { level: 6 });
}

/* --- localización de campos por su rótulo (robusto a distintas versiones del formato) --- */
function _sharedStrings(files) {
  const f = files['xl/sharedStrings.xml']; if (!f) return [];
  const xml = fflate.strFromU8(f);
  return (xml.match(/<si>[\s\S]*?<\/si>/g) || []).map(si =>
    (si.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || []).map(t => t.replace(/<[^>]+>/g, '')).join('')
      .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>'));
}
function _mapaEtiquetas(xml, ss) {
  const map = {};
  // celdas: autocerradas (<c .../>) o con contenido (<c ...>…</c>), sin desbordar entre ellas
  (xml.match(/<c\b[^>]*\/>|<c\b[^>]*>[\s\S]*?<\/c>/g) || []).forEach(c => {
    const ref = (c.match(/r="([A-Z]+\d+)"/) || [])[1]; let txt = '';
    if (/t="s"/.test(c)) txt = ss[+(c.match(/<v>(\d+)<\/v>/) || [])[1]] || '';
    else if (/t="inlineStr"/.test(c)) txt = ((c.match(/<t[^>]*>([\s\S]*?)<\/t>/) || [])[1] || '')
      .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
    if (txt) map[ref] = txt;
  });
  return map;
}
const _colNum = c => { let n = 0; for (const ch of c) n = n * 26 + (ch.charCodeAt(0) - 64); return n; };
const _numCol = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; };
const _offRef = (ref, dc, dr) => { const m = ref.match(/([A-Z]+)(\d+)/); return _numCol(_colNum(m[1]) + dc) + (+m[2] + dr); };
function _refEtiqueta(mapa, re, porDefecto) {
  for (const ref in mapa) if (re.test(norm(mapa[ref]))) return ref;
  return porDefecto;
}

/** Especificación de celda según el valor: fecha, número o texto; vacío → blanco. */
function _specFF(valor, tipo) {
  if (valor === null || valor === undefined || String(valor).trim() === '') return { blank: true };
  if (tipo === 'date') return (valor instanceof Date && !isNaN(valor))
    ? { tipo: 'date', valor: _serialFecha(valor) } : { blank: true };
  if (tipo === 'n') { const nn = num(valor); return { tipo: 'n', valor: nn }; }
  if (tipo === 'auto') { const s = String(valor).trim();
    return /^-?\d+(\.\d+)?$/.test(s) ? { tipo: 'n', valor: +s } : { valor: valor }; }
  return { valor: valor };
}

/** Ficha Financiera: rellena la plantilla FF. Con un registro simple (calculador) llena
    nombre/fechas/devengos/sigla; con un registro completo (tabla maestra COMPLETAR) llena
    además facultad, coordinador, tarifas, etc. Los campos ausentes quedan en blanco. */
function llenarFF(templateBytes, p) {
  const siglaCC = p.siglaCC || p.sigla || '';
  // cada campo: [regex del rótulo, celda de rótulo por defecto, [ [dcol,dfila,valor,tipo], … ] ]
  const CAMPOS = [
    [/^NOMBRE PROGRAMA/, 'C19', [[1, 0, p.nombre, 's']]],
    [/NOMBRE SIGLA CC/, 'F19', [[1, 0, siglaCC, 's']]],
    [/^FACULTAD/, 'C20', [[1, 0, p.facultad, 's']]],
    [/SUB ?AREA/, 'C21', [[1, 0, p.subarea, 's']]],
    [/SUBTIPO DE PROGRAMA/, 'C22', [[1, 0, p.subtipo, 's']]],
    [/^TIPO PROGRAMA/, 'C24', [[1, 0, p.tipoPrograma, 's']]],
    [/LINK COHORTE/, 'C25', [[1, 0, p.link, 's']]],
    [/N[UÚ]MERO DE COHORTE/, 'F25', [[1, 0, p.nCohorte, 'auto']]],
    [/FECHA INICIO PROGRAMA/, 'C26', [[1, 0, p.inicio, 'date']]],
    [/FECHA T[EÉ]RMINO PROGRAMA/, 'F26', [[1, 0, p.termino, 'date']]],
    [/^COORDINADOR/, 'C27', [[1, 0, p.coordinador, 's']]],
    [/DIRECTOR/, 'C28', [[1, 0, p.director, 's']]],
    [/DEFINICION DE USO/, 'C29', [[1, 0, p.definicionUso, 's']]],
    [/TIPO DE VENTA/, 'C32', [[1, 0, p.tipoVenta, 's']]],
    [/TIPO DOCENCIA/, 'F32', [[1, 0, p.tipoDocencia, 's']]],
    [/C[OÓ]DIGO SENCE/, 'C34', [[1, 0, p.codigoSence, 'auto']]],
    [/HORAS CRONOL/, 'F34', [[1, 0, p.horasCron, 'auto']]],
    [/SOLICITANTE/, 'C37', [[1, 0, p.solicitante, 's']]],
    [/APROBADOR/, 'C38', [[1, 0, p.aprobador, 's']]],
    [/VALOR POSTULACI/, 'C46', [[1, 0, p.monedaPost, 's'], [2, 0, p.valorPost, 'n']]],
    [/VALOR MATR[IÍ]CULA/, 'C47', [[1, 0, p.monedaMat, 's'], [2, 0, p.valorMat, 'n']]],
    [/VALOR ARANCEL/, 'C48', [[1, 0, p.monedaAra, 's'], [2, 0, p.valorAra, 'n']]],
    [/N[UÚ]MERO DE DEVENGOS/, 'C59', [[1, 0, p.nDev, 'n'], [0, 2, p.mesesDev, 's']]],
    [/N[UÚ]MERO DE VENCIMIENTOS/, 'F59', [[1, 0, p.nVenc, 'n'], [0, 2, p.mesesVenc, 's']]],
  ];
  return _llenarPlantilla(templateBytes, nm => /^FF$/i.test(nm.trim()) || nm.trim() === '', (xml, files) => {
    const mapa = _mapaEtiquetas(xml, _sharedStrings(files));
    CAMPOS.forEach(([re, def, puts]) => {
      const ref = _refEtiqueta(mapa, re, def);
      puts.forEach(([dc, dr, val, tipo]) => { xml = _setCell(xml, _offRef(ref, dc, dr), _specFF(val, tipo)); });
    });
    return xml;
  });
}

/** Suma n meses a una fecha, ajustando el día al último día del mes si se pasa. */
function _sumaMeses(d, n) {
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const ult = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(d.getDate(), ult));
  return t;
}

/** Rellena el XML del formato de solicitud con un ítem (programa + año). */
function _fillPeriodoXml(baseXml, it) {
  let xml = baseXml;
  xml = _setCell(xml, 'F14', { valor: it.nombre });                       // Nombre del Programa
  if (it.inicio) xml = _setCell(xml, 'K9', { tipo: 'date', valor: _serialFecha(it.inicio) });  // inicio clases
  if (it.termino) xml = _setCell(xml, 'L9', { tipo: 'date', valor: _serialFecha(it.termino) }); // término clases
  if (it.anio) { xml = _setCell(xml, 'E9', { tipo: 'n', valor: it.anio }); // Año Período
    xml = _setCell(xml, 'M14', { tipo: 'n', valor: it.anio }); }           // Año Cohorte
  // Sigla del Programa (L14)
  xml = _setCell(xml, 'L14', it.sigla ? { valor: it.sigla } : { blank: true });
  // Fecha cierre del período (M9) = fecha de término + 2 meses
  xml = _setCell(xml, 'M9', it.termino
    ? { tipo: 'date', valor: _serialFecha(_sumaMeses(it.termino, 2)) } : { blank: true });
  // Nombre asignado al período (R9) = sigla + año + '-' + ordinal  (ej. DNIA2027-1)
  const nomAsig = (it.sigla ? String(it.sigla).replace(/\s+/g, '') : '') +
    (it.anio || '') + '-' + (it.ordinal || 1);
  xml = _setCell(xml, 'R9', (it.sigla || it.anio) ? { valor: nomAsig } : { blank: true });
  // ID Cohorte Postula (R14) = Número de Cohorte
  const nc = it.nCohorte;
  xml = _setCell(xml, 'R14', (nc !== undefined && nc !== null && String(nc).trim() !== '')
    ? _specFF(nc, 'auto') : { blank: true });
  ['A9', 'B9', 'C9', 'D9', 'F9', 'G9', 'H9', 'I9', 'J9',
   'N14', 'O14', 'P14', 'Q14', 'S14']
    .forEach(ref => { xml = _setCell(xml, ref, { blank: true }); });
  return xml;
}

/** Un programa que abarca varios años calendario genera un ítem por año académico.
    Año 1 empieza en el inicio real; los siguientes se aproximan al 1-ene, y el último
    termina en el término real (el calculador no trae las fechas separadas por año). */
function expandirPeriodos(p) {
  if (!p.inicio) return [{ nombre: p.nombre, sigla: p.sigla || '', nCohorte: p.nCohorte,
    inicio: p.inicio, termino: p.termino, anio: '', ordinal: 1, total: 1 }];
  const y0 = p.inicio.getFullYear(), y1 = p.termino ? p.termino.getFullYear() : y0;
  const items = [];
  for (let y = y0; y <= y1; y++) {
    items.push({
      nombre: p.nombre, sigla: p.sigla || '', nCohorte: p.nCohorte,
      inicio: y === y0 ? p.inicio : new Date(y, 0, 1),
      termino: (p.termino && y === y1) ? p.termino : new Date(y, 11, 31),
      anio: y, ordinal: y - y0 + 1, total: y1 - y0 + 1,
    });
  }
  return items;
}

/** Nombre de hoja válido para Excel (≤31 caracteres, sin caracteres prohibidos, único). */
function _sanSheet(name, usados) {
  let n = String(name).replace(/[\[\]\*\/\\\?:]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 31) || 'Hoja';
  const base = n; let k = 2;
  while (usados.has(n.toLowerCase())) { const suf = ' (' + k + ')'; n = base.slice(0, 31 - suf.length) + suf; k++; }
  usados.add(n.toLowerCase()); return n;
}

/** Construye un .xlsx con una hoja de solicitud por ítem (+ hojas de parámetros del
    formato), conservando el formato. Sirve para la descarga individual (los años de un
    programa) y la consolidada (todos los programas × sus años). */
function construirLibroPeriodos(templateBytes, items) {
  const files = fflate.unzipSync(templateBytes);
  const basePath = _hojaPath(files, nm => /SOLICITUD|FORMATO|COHORTE/i.test(nm));
  const baseXml = fflate.strFromU8(files[basePath]);
  let wb = fflate.strFromU8(files['xl/workbook.xml']);
  const rels = fflate.strFromU8(files['xl/_rels/workbook.xml.rels']);
  let ct = fflate.strFromU8(files['[Content_Types].xml']);

  const relEls = rels.match(/<Relationship\b[^>]*\/?>/g) || [];
  const relTarget = id => { const r = relEls.find(e => e.includes('Id="' + id + '"')); return r ? (r.match(/Target="([^"]+)"/) || [])[1] : null; };
  const sheetDefs = wb.match(/<sheet\b[^>]*\/>/g) || [];
  const params = [];
  sheetDefs.forEach(def => {
    const rid = (def.match(/r:id="([^"]+)"/) || [])[1];
    const p = 'xl/' + String(relTarget(rid)).replace(/^\//, '').replace(/^xl\//, '');
    // Se conservan SOLO las hojas de parámetros ocultas (listas de desplegables como
    // Hoja1/Hoja2). Las hojas visibles distintas al formato (ej. ejemplos de programas
    // en la plantilla original) se descartan para no arrastrarlas a cada descarga.
    if (p !== basePath && /state="hidden"/.test(def)) params.push({ def, path: p });
  });
  const otras = relEls.filter(e => !/relationships\/worksheet/i.test(e));  // styles/theme/…

  let maxN = 0;
  Object.keys(files).forEach(f => { const m = f.match(/xl\/worksheets\/sheet(\d+)\.xml$/); if (m) maxN = Math.max(maxN, +m[1]); });

  const usados = new Set();
  const hojas = [];
  items.forEach((it, i) => {
    const xml = _fillPeriodoXml(baseXml, it);
    let path;
    if (i === 0) path = basePath; else { maxN++; path = 'xl/worksheets/sheet' + maxN + '.xml'; }
    files[path] = fflate.strToU8(xml);
    // el sufijo de año va sí o sí (Excel limita a 31 chars): se recorta el nombre, no el sufijo.
    // Se usa la sigla si está disponible (nombres de hoja más limpios), si no el nombre.
    const suf = it.total > 1 ? (' A' + it.ordinal + ' ' + it.anio) : (it.anio ? ' ' + it.anio : '');
    const corto = it.sigla || it.nombre;
    const etiqueta = String(corto).slice(0, 31 - suf.length).trim() + suf;
    hojas.push({ name: _sanSheet(etiqueta, usados), path });
  });

  let rid = 1, sid = 1;
  const sheetOut = [], relOut = [];
  const addRel = (id, tgt, typ, mode) => relOut.push('<Relationship Id="' + id + '" Type="' + typ + '" Target="' + tgt + '"' + (mode || '') + '/>');
  const WS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet';
  const RNS = ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  hojas.forEach(s => { const id = 'rId' + rid++; sheetOut.push('<sheet' + RNS + ' name="' + _escXml(s.name) + '" sheetId="' + (sid++) + '" r:id="' + id + '"/>'); addRel(id, s.path.replace(/^xl\//, ''), WS); });
  params.forEach(pp => {
    const id = 'rId' + rid++, nm = (pp.def.match(/name="([^"]*)"/) || [])[1];
    const st = /state="hidden"/.test(pp.def) ? ' state="hidden"' : '';
    sheetOut.push('<sheet' + RNS + ' name="' + _escXml(nm) + '" sheetId="' + (sid++) + '"' + st + ' r:id="' + id + '"/>');
    addRel(id, pp.path.replace(/^xl\//, ''), WS);
  });
  otras.forEach(e => {
    const id = 'rId' + rid++, tgt = (e.match(/Target="([^"]+)"/) || [])[1], typ = (e.match(/Type="([^"]+)"/) || [])[1];
    addRel(id, tgt, typ, /TargetMode="External"/.test(e) ? ' TargetMode="External"' : '');
  });

  wb = wb.replace(/<sheets>[\s\S]*?<\/sheets>/, '<sheets>' + sheetOut.join('') + '</sheets>');
  files['xl/workbook.xml'] = fflate.strToU8(wb);
  files['xl/_rels/workbook.xml.rels'] = fflate.strToU8(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    relOut.join('') + '</Relationships>');

  const keep = new Set([...hojas.map(s => s.path), ...params.map(p => p.path)]);
  // quitar overrides de content-types de worksheets que ya no existen
  ct = ct.replace(/<Override\b[^>]*PartName="\/(xl\/worksheets\/sheet\d+\.xml)"[^>]*\/>/g,
    (m, p) => keep.has(p) ? m : '');
  // agregar override para cada worksheet que se conserva y no lo tenga
  keep.forEach(p => { const part = '/' + p; if (!ct.includes('PartName="' + part + '"')) ct = ct.replace('</Types>', '<Override PartName="' + part + '" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'); });
