  files['[Content_Types].xml'] = fflate.strToU8(ct);
  Object.keys(files).forEach(f => { if (/xl\/worksheets\/sheet\d+\.xml$/.test(f) && !keep.has(f)) delete files[f]; });

  return fflate.zipSync(files, { level: 6 });
}

/** Descarga individual: un libro con los años académicos de UN programa. */
function llenarPeriodo(templateBytes, prog) {
  return construirLibroPeriodos(templateBytes, expandirPeriodos(prog));
}

/* ================= validación contra el reporte SPA ===================== */
/* El SPA (sistema de registro de actividades) trae la sigla de malla en la columna
   "Codigo" y el nombre en "Nombre". Se cruza contra las asignaturas del calendario
   (que ya están emparejadas a la malla) por sigla y, si no, por nombre. */

function leerSPA(filas) {
  let hi = -1, map = {};
  for (let i = 0; i < Math.min(15, filas.length); i++) {
    const r = (filas[i] || []).map(norm), idx = {};
    r.forEach((t, j) => {
      if (t === 'CODIGO' && idx.codigo === undefined) idx.codigo = j;
      else if (t === 'NOMBRE' && idx.nombre === undefined) idx.nombre = j;
      else if (t === 'PROGRAMA' && idx.programa === undefined) idx.programa = j;
      else if (t === 'HORAS' && idx.horas === undefined) idx.horas = j;
      else if (t === 'TIPO' && idx.tipo === undefined) idx.tipo = j;
      else if (t === 'PROFESORES' && idx.profesores === undefined) idx.profesores = j;
    });
    if (idx.codigo !== undefined && idx.nombre !== undefined && idx.programa !== undefined) {
      hi = i; map = idx; break;
    }
  }
  if (hi < 0) return null;
  const g = (r, k) => (map[k] !== undefined && r[map[k]] != null) ? String(r[map[k]]).trim() : '';
  const out = [];
  for (let i = hi + 1; i < filas.length; i++) {
    const r = filas[i] || [];
    const codigo = g(r, 'codigo'), nombre = g(r, 'nombre');
    if (!nombre && !codigo) continue;
    out.push({ codigo, nombre, programa: g(r, 'programa'), horas: num(g(r, 'horas')),
               tipo: g(r, 'tipo'), profesores: g(r, 'profesores') });
  }
  return out;
}

/** Prueba todas las hojas y devuelve las filas SPA de la primera hoja válida. */
function leerSPAMejor(hojas) {
  for (const h of hojas) {
    const r = leerSPA(h.filas);
    if (r && r.length) return { filas: r, hoja: h.nombre };
  }
  return null;
}

// Una sigla de malla luce así: 2-6 letras + 2-6 dígitos (FIN400, MKT00924, MACH223,
// PHIL427, TICS107). Se usa para separar asignaturas reales de filas administrativas
// del SPA (DIRECCIÓN, DA, ADM, TRASLADO, s/codigo, "ACTIVIDAD TERMINO"…).
const SIGLA_RE = /^[A-Z]{2,6}\d{2,6}[A-Z]?$/;
const esSiglaSPA = cod => SIGLA_RE.test(norm(cod).replace(/\s+/g, ''));

/** Elige el grupo (Programa / centro de costo) del SPA cuyas siglas más calzan con la
    malla activa. El cruce se restringe a ESE grupo — el CC que estamos analizando. */
function grupoSPA(spaRows, malla) {
  const sig = new Set(malla.map(a => norm(a.sigla)));
  const grupos = {};
  spaRows.forEach(r => {
    // se agrupa por programa/CC; no se filtra por TIPO (los diplomados usan
    // "Actividad de CDC" y los magísters "Asignatura Regular").
    (grupos[r.programa] = grupos[r.programa] || []).push(r);
  });
  let best = null, bn = -1, ranking = [];
  Object.entries(grupos).forEach(([p, rs]) => {
    const m = new Set(rs.filter(r => sig.has(norm(r.codigo))).map(r => norm(r.codigo))).size;
    if (!m) return;                       // grupos sin ninguna sigla de la malla se descartan
    ranking.push({ programa: p, calzan: m, total: rs.length });
    if (m > bn) { bn = m; best = p; }
  });
  ranking.sort((a, b) => b.calzan - a.calzan);
  return { grupo: best, filas: grupos[best] || [], ranking: ranking.slice(0, 6), calzan: Math.max(0, bn) };
}

/* Conciliación de TRES fuentes, anclada en la SIGLA de la malla:
   Malla (HP) · Calendario (horas programadas) · SPA (horas registradas).
   La malla es la base; para cada una de sus siglas se busca el mismo código en el
   calendario y en el SPA y se traen las horas para compararlas. */
function validarSPA(malla, detalle, spaRows) {
  const { grupo, filas, ranking, calzan } = grupoSPA(spaRows, malla);

  // SPA del CC elegido: una entrada por FILA (no se pre-suman por código, porque el SPA
  // puede reutilizar un mismo código para asignaturas distintas). Se descartan filas admin.
  const spaList = filas
    .filter(r => esSiglaSPA(norm(r.codigo).replace(/\s+/g, '')))
    .map(r => ({ codigo: r.codigo, cod: norm(r.codigo).replace(/\s+/g, ''),
                 nombre: r.nombre, horas: r.horas, used: false }));

  // Entre un conjunto de filas SPA, toma el subgrupo con el mismo NOMBRE que mejor calza
  // (así se suman solo las filas de LA MISMA asignatura, no dos asignaturas con igual código).
  const mejorSub = (cand, nombre) => {
    const porNom = new Map();
    cand.forEach(r => { const k = norm(r.nombre); (porNom.get(k) || porNom.set(k, []).get(k)).push(r); });
    let best = null, bs = -1;
    porNom.forEach(rs => { const s = similitud(nombre, rs[0].nombre); if (s > bs) { bs = s; best = rs; } });
    return { filas: best, horas: best.reduce((t, r) => t + r.horas, 0),
             codigo: best[0].codigo, nombre: best[0].nombre, sim: bs };
  };

  const calBySig = new Map();
  detalle.filter(d => d.sesiones > 0 && d.sigla).forEach(d => calBySig.set(norm(d.sigla), d));

  const rows = [];
  const dif = (sigla, nombre, hpM, hCal, hSpa, spaCod, spaNom, tipos) =>
    rows.push({ sigla, nombre, hp_malla: hpM, horas_cal: hCal, horas_spa: hSpa,
                spa_codigo: spaCod, spa_nombre: spaNom, tipos });

  // 1) recorrer la malla (base)
  malla.forEach(a => {
    const k = norm(a.sigla);
    const cal = calBySig.get(k);
    let spa = null, spaCod = '', siglaDistinta = false;
    // por código exacto (varias filas del mismo código → se toma la del nombre que calza)
    const porCod = spaList.filter(r => !r.used && r.cod === k);
    if (porCod.length) {
      const g = mejorSub(porCod, a.nombre);
      g.filas.forEach(r => r.used = true);
      spa = g; spaCod = g.codigo;
    } else {
      // por nombre (código distinto)
      const porNom = spaList.filter(r => !r.used && similitud(a.nombre, r.nombre) >= 0.72);
      if (porNom.length) {
        const g = mejorSub(porNom, a.nombre);
        g.filas.forEach(r => r.used = true);
        spa = g; spaCod = g.codigo; siglaDistinta = true;
      }
    }
    const hCal = cal ? cal.horas_programadas : null;
    const hSpa = spa ? spa.horas : null;
    const tipos = [];
    if (hCal === null) tipos.push('Falta en calendario');
    if (hSpa === null) tipos.push('Falta en SPA');
    if (siglaDistinta) tipos.push('Sigla distinta en SPA');
    if (spa && !siglaDistinta && similitud(a.nombre, spa.nombre) < 0.72) tipos.push('Nombre distinto en SPA');
    if (hCal !== null && Math.abs(hCal - a.hp) > 0.5) tipos.push('Horas calendario ≠ malla');
    if (hSpa !== null && Math.abs(hSpa - a.hp) > 0.5) tipos.push('Horas SPA ≠ malla');
    if (tipos.length) dif(a.sigla, a.nombre, a.hp, hCal, hSpa, spaCod, spa ? spa.nombre : '', tipos);
  });

  // 2) filas SPA no usadas → adicional (se suman solo las de mismo código + nombre)
  const extra = new Map();
  spaList.filter(r => !r.used).forEach(r => {
    const k = r.cod + '|' + norm(r.nombre);
    if (!extra.has(k)) extra.set(k, { codigo: r.codigo, nombre: r.nombre, horas: 0 });
    extra.get(k).horas += r.horas;
  });
  extra.forEach(v => dif(v.codigo, v.nombre, null, null, v.horas, v.codigo, v.nombre, ['Adicional en SPA']));

  const spaSig = new Set(spaList.map(r => r.cod));

  const cnt = t => rows.filter(r => r.tipos.includes(t)).length;
  return {
    grupo, ranking, diffs: rows,
    resumen: {
      asignaturas_malla: malla.length, asignaturas_cal: calBySig.size,
      asignaturas_spa: spaSig.size, calzan,
      falta_spa: cnt('Falta en SPA'), falta_cal: cnt('Falta en calendario'),
      adicional: cnt('Adicional en SPA'), nombre: cnt('Nombre distinto en SPA'),
      sigla: cnt('Sigla distinta en SPA'),
      horas: cnt('Horas calendario ≠ malla') + cnt('Horas SPA ≠ malla'),
    },
  };
}

/* --------------------------- comparación -------------------------------- */
function compararModalidades(detA, detB, na, nb) {
  const ia = {}, ib = {};
  detA.forEach(d => (ia[d.sigla] = d)); detB.forEach(d => (ib[d.sigla] = d));
  return [...new Set([...Object.keys(ia), ...Object.keys(ib)])].sort().map(sig => {
    const a = ia[sig], b = ib[sig], difs = [];
    if (!a) difs.push(`Ausente en ${na}`);
    if (!b) difs.push(`Ausente en ${nb}`);
    if (a && b) {
      if (a.horas_programadas !== b.horas_programadas)
        difs.push(`Horas ${na}=${a.horas_programadas} vs ${nb}=${b.horas_programadas}`);
      const da = a.docentes, db = b.docentes;
      const set = (x, y) => x.length === y.length && x.every(v => y.includes(v));
      if (da.length && db.length && !set(da, db)) {
        const soloA = da.filter(x => !db.some(y => ratio(norm(x), norm(y)) > 0.85));
        const soloB = db.filter(y => !da.some(x => ratio(norm(x), norm(y)) > 0.85));
        if (soloA.length || soloB.length)
          difs.push(`Docentes distintos: ${da.join(', ')} vs ${db.join(', ')}`);
        else
          difs.push(`Misma persona con grafía distinta: ${da.join(', ')} vs ${db.join(', ')} (normalizar nombre)`);
      }
      if (a.sesiones !== b.sesiones) difs.push(`Sesiones ${a.sesiones} vs ${b.sesiones}`);
    }
    const r = { sigla: sig, nombre: (a || b).nombre, periodo: (a || b).periodo, hp_malla: (a || b).hp_malla, diferencias: difs };
    r['horas_' + na] = a ? a.horas_programadas : null;
    r['horas_' + nb] = b ? b.horas_programadas : null;
    r['docentes_' + na] = a ? a.docentes.join(', ') : '';
    r['docentes_' + nb] = b ? b.docentes.join(', ') : '';
    return r;
  });
}

function b64ToU8(b64){ const s=atob(b64),u=new Uint8Array(s.length); for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i); return u; }

/* ===================== carga de archivos ===================== */
function leerArchivo(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{ try{ res(filasDe(new Uint8Array(e.target.result))); }catch(err){ rej(err); } };
    r.onerror=()=>rej(new Error('No se pudo leer '+file.name));
    r.readAsArrayBuffer(file);
  });
}

  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{ try{ res(filasDeHojas(new Uint8Array(e.target.result))); }catch(err){ rej(err); } };
    r.onerror=()=>rej(new Error('No se pudo leer '+file.name));
    r.readAsArrayBuffer(file);
  });
}

async function cargarMalla(file){
  ST.error='';
  try{
    const filas=await leerArchivo(file);
    const progs=programasDe(filas);
    if(!progs.length){
      ST.error='El archivo "'+file.name+'" no tiene una columna PROGRAMA reconocible. '+
        'La malla debe traer encabezados en la primera fila: Programa, Período, Sigla, Nombre, CS, HA, HP, HNP, TA.';
      return render();
    }
    ST._mallaFilas=filas; ST.programas=progs; ST.mallaNombre=file.name;
    ST.programaManual=false;
    ST.programa=progs[0][0];
    autoDetectarPrograma();       // si ya hay calendarios, elige el plan que calza
    aplicarPrograma();
  }catch(e){ ST.error='Error al leer la malla: '+e.message; }
  render();
}

const COBERTURA_MIN=0.35;   // bajo esto, no se asume ningún plan

function aplicarPrograma(){
  ST.malla = ST.programa ? leerMalla(ST._mallaFilas,ST.programa) : [];
  ST.datos=null;
  // el nombre del programa en el reporte sigue al plan activo: no se queda pegado
  // al del análisis anterior
  ST.reporteMeta.programa=''; ST.reporteMeta.abrev='';
  if(ST.programa && !ST.malla.length)
    ST.error='El programa "'+ST.programa+'" no tiene asignaturas en el archivo.';
}

/** Detecta contra qué plan de la malla calzan los calendarios cargados.
    Si ninguno calza razonablemente, no fuerza un plan (evita siglas equivocadas). */
function autoDetectarPrograma(){
  ST.deteccion=null;
  if(!ST._mallaFilas||!ST.calendarios.length||ST.programaManual) return;
  const bloques=ST.calendarios.flatMap(c=>c.bloques);
  const r=detectarPrograma(ST._mallaFilas,bloques);
  if(!r) return;
  const cob=r.mejor.calzan/r.mejor.bloques;
  r.sinPlan = cob<COBERTURA_MIN;
  ST.deteccion=r;
  ST.programa = r.sinPlan ? '' : r.mejor.programa;
}

async function cargarCalendarios(files){
  ST.error='';
  for(const f of files){
    try{
      const hojas=await leerArchivoHojas(f);
      const h0=(hojas[0].filas[0]||[]).map(norm);
      if(h0.includes('PROGRAMA')&&h0.includes('SIGLA')&&hojas.length===1){
        ST.error='"'+f.name+'" parece ser un archivo de malla curricular, no un calendario. '+
          'Cárguelo en el recuadro de la izquierda.';
        continue;
      }
      const R=leerCalendarioMejor(hojas);
      if(!R.bloques.length||R.conFecha<3){
        ST.error='El archivo "'+f.name+'" no contiene sesiones calendarizadas reconocibles'+
          (R.bloques.length?' (solo '+R.conFecha+' con fecha válida)':'')+'. '+
          'Se espera, o bien una tabla con encabezados (Asignatura · Fecha · Horario · '+
          'Profesor · Horas), o bien el nombre de la asignatura seguido de sus sesiones.';
        continue;
      }
      let et=f.name.replace(/\.(xlsx?|xlsm)$/i,'');
      const m=et.match(/blended|presencial|online|vespertino|diurno/i);
      if(m) et=m[0][0].toUpperCase()+m[0].slice(1).toLowerCase();
      else et=et.replace(/calendario\s*/i,'').split(/[_(]/)[0].trim().slice(0,28)||et;
      ST.calendarios.push({archivo:f.name, etiqueta:et, bloques:R.bloques, notas:R.notas,
                           totales:R.totales||[], hoja:R.hoja, formato:R.formato, otrasHojas:R.otrasHojas||[]});
      ST.datos=null;
    }catch(e){ ST.error='Error al leer "'+f.name+'": '+e.message; }
  }
  autoDetectarPrograma();
  aplicarPrograma();
  render();
}

async function cargarSPA(file){
  ST.spa.error='';
  try{
    const hojas=await leerArchivoHojas(file);
    const R=leerSPAMejor(hojas);
    if(!R){ ST.spa.error='"'+file.name+'" no parece un reporte SPA (no se encontraron las columnas '+
      'Codigo, Nombre, Programa). Verifique el archivo.'; ST.spa.filas=null; }
    else { ST.spa.nombre=file.name; ST.spa.filas=R.filas; }
    ST.datos=null;
  }catch(e){ ST.spa.error='Error al leer "'+file.name+'": '+e.message; }
  render();
}

/* ===================== ejecutar análisis ===================== */
function ejecutar(){
  ST.error='';
  try{
    const mods=ST.calendarios.map((c,i)=>{
      const r=analizar(ST.malla,c.bloques,c.notas,c.etiqueta,c.totales);
      return {id:'m'+i, modalidad:c.etiqueta, archivo:c.archivo, ...r};
    });
    const d={programa:ST.programa||'(sin plan)', generado:new Date().toISOString().slice(0,19),
             modalidades:mods, malla:ST.malla,
             resumen_ejecutivo:resumenEjecutivo(ST.malla,mods)};
    if(mods.length>=2){
      const na=mods[0].modalidad, nb=mods[1].modalidad;
      d.comparacion={a:na,b:nb,filas:compararModalidades(mods[0].detalle,mods[1].detalle,na,nb)};
    }
    if(ST.spa.filas && ST.malla && ST.malla.length){
      // cruce contra todas las asignaturas calendarizadas (unión de modalidades)
      const detTodas=[]; const vistas=new Set();
      mods.forEach(m=>m.detalle.forEach(x=>{ if(x.sigla && !vistas.has(x.sigla)){vistas.add(x.sigla);detTodas.push(x);} }));
      d.spa=validarSPA(ST.malla,detTodas,ST.spa.filas);
      d.spaArchivo=ST.spa.nombre;
      // fila en el cuadro de mando
      const R=d.spa.resumen, cols=d.resumen_ejecutivo.columnas;
      const totDif=d.spa.diffs.length;
      const vals={}; cols.forEach(c=>vals[c]=String(totDif));
      const estado=totDif===0?'🟢 CUMPLIDO':((R.falta_spa||R.falta_cal||R.sigla)?'🔴 CRÍTICO':'🟡 DESVIACIÓN');
      d.resumen_ejecutivo.filas.push({
        indicador:'Conciliación Malla·Calendario·SPA', malla_base:R.asignaturas_malla+' asig.', valores:vals, estado,
        observacion:`CC SPA «${d.spa.grupo||'—'}»: ${R.falta_spa} faltan en SPA, `+
          `${R.falta_cal} sin calendarizar, ${R.sigla} sigla(s) distinta(s), `+
          `${R.nombre} nombre(s) distinto(s), ${R.horas} con horas distintas.`,
        detalle:d.spa.diffs.map(x=>({txt:`${x.sigla||x.spa_codigo||'—'} ${x.nombre}: `+
          `malla ${x.hp_malla==null?'—':x.hp_malla+'h'} · calendario ${x.horas_cal==null?'—':x.horas_cal+'h'} · `+
          `SPA ${x.horas_spa==null?'—':x.horas_spa+'h'}  [${x.tipos.join(', ')}]`}))
      });
    }
    ST.datos=d;
  }catch(e){ ST.error='Error durante el análisis: '+e.message; }
  render(0);
}

const hojaNombre=(s)=>{
  const usados=hojaNombre._u||(hojaNombre._u=new Set());
  let n=String(s).replace(/[\[\]\*\/\\\?:]/g,'-').slice(0,31)||'Hoja';
  let i=2; while(usados.has(n)){ const suf=' ('+i+')'; n=n.slice(0,31-suf.length)+suf; i++; }
  usados.add(n); return n;
};

/* ancho de columna ignorando las filas de título (que ocupan una sola celda ancha) */
function anchos(aoa,ignorar,max=48){
  const n=Math.max(...aoa.map(r=>r.length));
  const w=[];
  for(let c=0;c<n;c++){
    let m=9;
    aoa.forEach((r,i)=>{
      if(ignorar&&ignorar.has(i)) return;
      let v=r[c];
      if(v&&typeof v==='object') v='0000-00-00';   // celda de fecha
      if(v!=null&&v!=='') m=Math.max(m,Math.min(max,String(v).length+2));
    });
    w.push({wch:m});
  }
  return w;
}

/** 'YYYY-MM-DD' -> celda de fecha real de Excel (serial + formato).
    Se usa el serial en vez de un Date para evitar el desfase por zona horaria. */
const fx=s=>{
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));
  if(!m) return s||'';
  return {t:'n', v:Date.UTC(+m[1],+m[2]-1,+m[3])/86400000+25569, z:'dd-mm-yyyy'};
};

function agregarHoja(wb,titulo,aoa,merges,filasTitulo){
  const ws=XLSX.utils.aoa_to_sheet(aoa,{cellDates:true,dateNF:'dd-mm-yyyy'});
  ws['!cols']=anchos(aoa,filasTitulo);
  if(merges&&merges.length) ws['!merges']=merges;
  XLSX.utils.book_append_sheet(wb,ws,hojaNombre(titulo));
  return ws;
}

function wireCarga(){
  const fM=$('fM'), fC=$('fC'), dzM=$('dzM'), dzC=$('dzC');
  if(dzM){
    dzM.onclick=()=>fM.click();
    fM.onchange=e=>{ if(e.target.files[0]) cargarMalla(e.target.files[0]); };
    dragdrop(dzM, files=>cargarMalla(files[0]));
  }
  if(dzC){
    dzC.onclick=()=>fC.click();
    fC.onchange=e=>{ if(e.target.files.length) cargarCalendarios([...e.target.files]); e.target.value=''; };
    dragdrop(dzC, files=>cargarCalendarios(files));
  }
  const dzS=$('dzSPA'), fS=$('fSPA');
  if(dzS){
    dzS.onclick=e=>{ if(!e.target.closest('[data-spax]')) fS.click(); };
    fS.onchange=e=>{ if(e.target.files[0]) cargarSPA(e.target.files[0]); e.target.value=''; };
    dragdrop(dzS, files=>{ if(files[0]) cargarSPA(files[0]); });
    const bx=dzS.querySelector('[data-spax]'); if(bx) bx.onclick=e=>{e.stopPropagation();quitarSPA();};
  }
  const sp=$('selProg'); if(sp) sp.onchange=e=>{
    ST.programa=e.target.value; ST.programaManual=true; ST.error='';
    aplicarPrograma(); render();
  };
  document.querySelectorAll('.etq').forEach(inp=>inp.onchange=e=>{
    ST.calendarios[+e.target.dataset.i].etiqueta=e.target.value.trim()||('Calendario '+(1+ +e.target.dataset.i));
    ST.datos=null; render();
  });
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=e=>{e.stopPropagation();quitarCalendario(+e.target.dataset.x);});
  const r=$('btnRun'); if(r) r.onclick=ejecutar;
  const x=$('btnXls'); if(x) x.onclick=descargarExcel;
  const j=$('btnJson'); if(j) j.onclick=descargarJSON;
  const c=$('btnClr'); if(c) c.onclick=limpiar;
}

function dragdrop(el,cb){
  ['dragenter','dragover'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();el.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();el.classList.remove('over');}));
  el.addEventListener('drop',e=>{ const f=[...e.dataTransfer.files]; if(f.length) cb(f); });
}

function claseEstado(e){
  if(e.indexOf('CUMPLIDO')>=0) return 'g-CUMPLIDO';
  if(e.indexOf('CRÍTICO')>=0||e.indexOf('CRITICO')>=0) return 'g-CRIT';

}

function cuadroMando(RE){
  const cols=RE.columnas, ncol=4+cols.length;
  const linea=x=>{
    const m=x.mod?`<b class="dmod">${esc(x.mod)}</b> `:'';
    const r=x.rec?` <span class="rec" style="display:inline">▸ ${esc(x.rec)}</span>`:'';
    const sig=(String(x.txt).match(/(?:•\s*)?([A-Z]{2,6}\d{2,6})\b/)||[])[1];
    const attr=sig?` class="hpmalla" data-sig="${esc(sig)}"`:'';
    return `<li${attr}>${m}${esc(x.txt)}${r}</li>`;
  };
  return `<table class="cmd"><thead><tr>
    <th style="width:250px">Indicador / Métrica</th>
    <th style="width:110px;text-align:center">Malla Base</th>
    ${cols.map(c=>`<th style="text-align:center">Calendario ${esc(c)}</th>`).join('')}
    <th style="width:150px;text-align:center">Estado Compliance</th>
    <th>Observación Técnica</th></tr></thead><tbody>
    ${RE.filas.map((f,i)=>{
      const hay=f.detalle&&f.detalle.length;
      return `<tr class="${claseEstado(f.estado)}${hay?' clic':''}" ${hay?`onclick="tog('re_${i}')"`:''}>
        <td class="ind">${hay?`<span class="exp" id="ex_re_${i}">▸ </span>`:''}${esc(f.indicador)}</td>
        <td class="base">${esc(f.malla_base)}</td>
        ${cols.map(c=>`<td class="val">${esc(f.valores[c])}</td>`).join('')}
        <td class="est">${esc(f.estado)}</td>
        <td class="obs">${esc(f.observacion)}</td></tr>
      ${hay?`<tr id="re_${i}" class="sess hide"><td colspan="${ncol}">
        <div class="detwrap"><ul class="detlist">${f.detalle.map(linea).join('')}</ul></div>
      </td></tr>`:''}`;
    }).join('')}
  </tbody></table>`;
}

function wireHallazgos(id){
  const tb=$('tb_'+id); if(!tb) return;
  const f=()=>{
    const n=$('niv_'+id).value, c=$('cat_'+id).value, q=$('q_'+id).value.toLowerCase();
    let v=0;
    [...tb.rows].forEach(r=>{
      const ok=(!n||r.dataset.n===n)&&(!c||r.dataset.c===c)&&(!q||r.dataset.t.includes(q));
      r.classList.toggle('hide',!ok); if(ok)v++;

  };
  ['niv_','cat_','q_'].forEach(p=>$(p+id).addEventListener('input',f));

/* Equivalente en navegador de:
     xls = pd.ExcelFile(path); print(xls.sheet_names)
     for s in xls.sheet_names: print(pd.read_excel(path, sheet_name=s).head(10))
   Lista las hojas del Excel y previsualiza las primeras filas de cada una. */

function bloqueHoja(h){
  const filas=h.filas||[];
  const vista=filas.slice(0,11);   // encabezado + head(10)
  // última columna con algún dato dentro de la vista (evita cientos de columnas vacías)
  let ncolReal=0;
  vista.forEach(r=>{ if(!r) return; for(let j=r.length-1;j>=0;j--){
    if(r[j]!==null&&r[j]!==undefined&&r[j]!==''){ ncolReal=Math.max(ncolReal,j+1); break; } }});
  const MAXC=30, ncol=Math.min(ncolReal,MAXC), oculto=Math.max(0,ncolReal-MAXC);
  const totalCol=Math.max(0,...filas.map(r=>r?r.length:0));
  const head=filas[0]||[], body=filas.slice(1,11);
  const celda=v=>(v===null||v===undefined||v==='')?'<span style="color:#cbd5e1">·</span>':esc(v);
  return `<h3 class="sec">Hoja: ${esc(h.nombre)}
      <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#94a3b8">
      — ${filas.length} filas × ${totalCol} columnas${oculto?` (se muestran las primeras ${MAXC})`:''}</span></h3>
    <div style="overflow:auto"><table><thead><tr><th style="width:34px">#</th>
      ${Array.from({length:ncol}).map((_,j)=>`<th>${celda(head[j])}</th>`).join('')}
      ${oculto?`<th>… +${oculto}</th>`:''}</tr></thead>
    <tbody>${body.map((r,i)=>`<tr><td class="mono" style="color:#94a3b8">${i}</td>
      ${Array.from({length:ncol}).map((_,j)=>`<td class="mono">${celda(r?r[j]:'')}</td>`).join('')}
      ${oculto?'<td style="color:#cbd5e1">…</td>':''}

const SPA_PILL={'Falta en SPA':'CRITICO','Falta en calendario':'CRITICO',
  'Adicional en SPA':'ADVERTENCIA','Sigla distinta en SPA':'CRITICO',
  'Nombre distinto en SPA':'ADVERTENCIA','Horas calendario ≠ malla':'ADVERTENCIA',
  'Horas SPA ≠ malla':'ADVERTENCIA'};
const hcell=(v,ref)=>{
  if(v===null||v===undefined) return '<span style="color:#cbd5e1">—</span>';
  const dis=(ref!==null&&ref!==undefined&&Math.abs(v-ref)>0.5);
  return `<span class="${dis?'delta-pos':''}">${v} h</span>`;
};

  return `<div class="kpis">
    ${kpi(total,'Asignaturas con diferencia',total?'warn':'ok')}
    ${kpi(R.asignaturas_malla,'Asignaturas en malla')}
    ${kpi(R.asignaturas_cal,'En calendario')}

    ${kpi(fila(R.falta_cal),'Sin calendarizar',R.falta_cal?'crit':'ok')}
    ${kpi(fila(R.sigla),'Siglas distintas',R.sigla?'crit':'ok')}

    <div class="sub">Base: <b>malla de ${esc(D.programa)}</b>. Para cada sigla se buscan las
      horas en el calendario y en el SPA y se comparan. Archivo SPA: <b>${esc(D.spaArchivo||'')}</b>

  </div>
  <div class="card">
    <h2>Diferencias por asignatura</h2>

      <span class="legend" id="spa_cnt"></span></div>
    <table><thead><tr>
      <th style="width:90px">Sigla malla</th><th>Nombre asignatura</th>
      <th class="num">HP Malla</th><th class="num">Horas Calendario</th><th class="num">Horas SPA</th>
      <th>Diferencia(s) detectada(s)</th></tr></thead>
    <tbody id="spa_tb">${S.diffs.map(x=>`
      <tr data-t="${esc(x.tipos.join('|'))}" data-s="${esc((x.sigla+' '+x.nombre).toLowerCase())}">
        <td class="mono">${esc(x.sigla)||'—'}${x.spa_codigo&&norm(x.spa_codigo)!==norm(x.sigla)?
          `<br><small style="color:#b91c1c">SPA: ${esc(x.spa_codigo)}</small>`:''}</td>

        <td class="num">${x.hp_malla==null?'<span style="color:#cbd5e1">—</span>':x.hp_malla+' h'}</td>

function wireSPA(){
  const tb=$('spa_tb'); if(!tb) return;
  const f=()=>{
    const t=$('spa_t').value, q=$('spa_q').value.toLowerCase(); let v=0;
    [...tb.rows].forEach(r=>{
      const ok=(!t||(r.dataset.t||'').split('|').includes(t))&&(!q||(r.dataset.s||'').includes(q));
      r.classList.toggle('hide',!ok); if(ok)v++;
    });
    const c=$('spa_cnt'); if(c) c.textContent=v+' de '+tb.rows.length;
  };

async function cargarCalculador(file){
  ST.ff.error='';
  try{
    const hojas=await leerArchivoHojas(file);
    // acepta la tabla maestra completa (formato_FF..._COMPLETAR) o el calculador de devengos
    let progs=leerCompletarFF(hojas), tipo='completa';
    if(!progs||!progs.length){ progs=leerCalculador(hojas); tipo='calculador'; }
    if(!progs||!progs.length){
      ST.ff.error='"'+file.name+'" no reconocido. Se espera el calculador de devengos '+
        '(hoja «Programas») o la tabla maestra de fichas (hoja «Hoja1» con Sigla/Facultad…).';
      ST.ff.programas=null;
    } else { ST.ff.calcNombre=file.name; ST.ff.programas=progs; ST.ff.tipo=tipo; }
  }catch(e){ ST.ff.error='Error al leer el archivo: '+e.message; }
  render();
}
function leerBytes(file){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=e=>res(new Uint8Array(e.target.result)); r.onerror=()=>rej(new Error('lectura'));
    r.readAsArrayBuffer(file); });
}
async function cargarPlantillaFF(file){
  ST.ff.error='';
  try{ ST.ff.template=await leerBytes(file); ST.ff.templateNombre=file.name; }
  catch(e){ ST.ff.error='Error al leer la plantilla FF: '+e.message; }
  render();
}
function siglaDe(p){ return p.sigla || getSigla(p.nombre); }
function fichaBytes(p){
  const tpl=plantillaFF();
  if(!tpl) throw new Error('No hay plantilla FF disponible. Cargue una plantilla.');
  // registro completo: usar su siglaCC ya armada; registro simple: usar la sigla editable
  return llenarFF(tpl, p._completo ? p : {...p, sigla:getSigla(p.nombre)});
}
function descargarFicha(i){
  try{

    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='FF_'+slugFF(siglaDe(p)||p.nombre)+'.xlsx'; a.click();
  }catch(e){ ST.ff.error=e.message; render(); }
}
function descargarTodasFichas(){

let _mallaPopEl=null;
function mallaPop(){ if(!_mallaPopEl){ _mallaPopEl=document.createElement('div'); _mallaPopEl.id='mallaPop'; document.body.appendChild(_mallaPopEl); } return _mallaPopEl; }
function mallaPopHTML(sig){
  const D=ST.datos; if(!D||!D.malla||!D.malla.length) return '';
  const malla=D.malla, maxHP=Math.max(1,...malla.map(a=>a.hp||0));
  const key=norm(sig||'');
  const pers={}; malla.forEach(a=>{ (pers[a.periodo]=pers[a.periodo]||[]).push(a); });
  const totHP=malla.reduce((t,a)=>t+(a.hp||0),0);
  let html=`<h4>Malla ${esc(D.programa)}</h4>
    <div class="mp-sub">${malla.length} asignaturas · ${totHP} HP totales · pase el cursor por las HP de la malla</div>`;
  Object.keys(pers).sort().forEach(p=>{
    html+=`<div class="mp-per">Período ${esc(p)}</div>`;
    pers[p].forEach(a=>{
      const on=norm(a.sigla)===key;
      const w=Math.round(100*(a.hp||0)/maxHP);
      html+=`<div class="mp-row ${on?'mp-on':''}" style="${on?'padding:3px 4px':''}">
        <span class="mp-sig">${esc(a.sigla)}</span>
        <span class="mp-nom" title="${esc(a.nombre)}">${esc(a.nombre)}</span>
        <span style="display:flex;align-items:center;gap:6px"><span class="mp-bar" style="flex:1"><span style="width:${w}%"></span></span>
        <span class="mp-hp">${a.hp||0} h</span></span></div>`;
    });
  });
  html+=`<div class="mp-tot">Total HP malla: ${totHP} h</div>`;
  return html;
}
function mostrarMallaPop(e,sig){
  const el=mallaPop(); const h=mallaPopHTML(sig); if(!h) return;
  el.innerHTML=h; el.style.display='block';
  // resaltar y auto-scroll a la asignatura
  const on=el.querySelector('.mp-on'); if(on) on.scrollIntoView({block:'center'});
  posicionarPop(e);
}
function posicionarPop(e){
  const el=mallaPop(); if(el.style.display!=='block') return;
  const w=el.offsetWidth||420, hh=el.offsetHeight||300, pad=12;
  let x=e.clientX+16, y=e.clientY+12;
  if(x+w+pad>innerWidth) x=e.clientX-w-16;
  if(y+hh+pad>innerHeight) y=Math.max(pad,innerHeight-hh-pad);
  el.style.left=Math.max(pad,x)+'px'; el.style.top=Math.max(pad,y)+'px';
}
function ocultarMallaPop(){ if(_mallaPopEl) _mallaPopEl.style.display='none'; }
function wireMallaPop(){
  document.querySelectorAll('.hpmalla').forEach(t=>{
    t.addEventListener('mouseenter',e=>mostrarMallaPop(e,t.dataset.sig));
    t.addEventListener('mousemove',posicionarPop);
    t.addEventListener('mouseleave',ocultarMallaPop);
  });
}

/* ===================== render ===================== */
let TAB_ACTIVA=0;

function render(forzarTab){
  if(forzarTab!==undefined) TAB_ACTIVA=forzarTab;
  const D=ST.datos, secciones=[];

  /* --- HOME --- */
  let home;
  if(!D){
    home=`<div class="kpis">
      ${kpi(0,'Indicadores cumplidos','vacio')}${kpi(0,'Validaciones OK','vacio')}
      ${kpi(0,'Advertencias','vacio')}${kpi(0,'Incumplimientos críticos','vacio')}
      ${kpi(ST.malla?ST.malla.length:0,'Asignaturas en malla',ST.malla?'':'vacio')}
      ${kpi(ST.calendarios.length,'Calendarios cargados',ST.calendarios.length?'':'vacio')}</div>
      ${bloqueCarga()}
      <div class="card"><h2>Resumen consolidado de cumplimiento &mdash; métricas</h2>
        <div class="sub">Los indicadores se completarán al ejecutar el análisis.</div>
        ${cuadroMandoVacio()}</div>
      ${bloqueAyuda()}`;
  } else {
    const RE=D.resumen_ejecutivo, tot={ok:0,adv:0,crit:0};
    D.modalidades.forEach(m=>{
      tot.ok+=m.hallazgos.filter(h=>h.nivel==='OK').length;
      tot.adv+=m.hallazgos.filter(h=>h.nivel==='ADVERTENCIA').length;
      tot.crit+=m.hallazgos.filter(h=>h.nivel==='CRITICO').length;
    });
    const cump=RE.filas.filter(f=>f.estado.indexOf('CUMPLIDO')>=0).length;
    home=`<div class="kpis">
      ${kpi(cump+'/'+RE.filas.length,'Indicadores cumplidos',cump===RE.filas.length?'ok':'warn')}
      ${kpi(tot.ok,'Validaciones OK','ok')}${kpi(tot.adv,'Advertencias','warn')}
      ${kpi(tot.crit,'Incumplimientos críticos','crit')}
      ${kpi(D.malla.length,'Asignaturas en malla')}${kpi(D.modalidades.length,'Calendarios analizados')}</div>
      ${bloqueCarga()}
      <div class="card">
        <h2>Resumen consolidado de cumplimiento &mdash; métricas</h2>
        <div class="sub">Programa <b>${esc(D.programa)}</b> · malla base contrastada contra cada calendario académico</div>
        ${cuadroMando(RE)}
        <div class="nota"><b>Nota:</b> todas las cifras se recalculan desde los archivos cargados;
        no hay valores digitados a mano. Contraste los totales de la malla contra el decreto vigente
        del programa antes de emitir el informe.</div>
      </div>`;
  }
  secciones.push({titulo:'Resumen Ejecutivo', html:home, after:wireCarga});

  /* --- pestañas por modalidad --- */
  if(D) D.modalidades.forEach(m=>{
    const H=m.hallazgos, R=m.resumen;
    const c=H.filter(h=>h.nivel==='CRITICO').length, a=H.filter(h=>h.nivel==='ADVERTENCIA').length,
          o=H.filter(h=>h.nivel==='OK').length;
    secciones.push({titulo:'Malla vs '+m.modalidad, after:()=>wireHallazgos(m.id), html:`
      <div class="kpis">
        ${kpi(o,'Requisitos cumplidos','ok')}${kpi(a,'Advertencias','warn')}
        ${kpi(c,'Incumplimientos críticos','crit')}${kpi(R.asignaturas_malla,'Asignaturas en malla')}
        ${kpi(R.creditos_totales,'Créditos totales')}${kpi(R.horas_malla_hp+' h','HP exigidas')}
        ${kpi(R.horas_programadas+' h','Horas programadas')}
        ${kpi(R.sin_calendario,'Sin calendarizar',R.sin_calendario?'crit':'ok')}</div>
      <div class="card"><h2>Ventana académica</h2>
        <div class="sub">Archivo <b>${esc(m.archivo||'')}</b> · del <b>${nz(dmy(R.inicio))}</b> al <b>${nz(dmy(R.fin))}</b> ·
        ${R.bloques_calendario} bloques · ${R.emparejadas} asignaturas emparejadas ·
        ${R.fuera_de_malla} bloques fuera de malla</div>
        <table><thead><tr><th>Semestre calendario</th><th class="num">Horas presenciales programadas</th></tr></thead>
        <tbody>${Object.entries(R.carga_por_semestre).sort().map(([k,v])=>
          `<tr><td class="mono">${k}</td><td class="num">${v}</td></tr>`).join('')}</tbody></table></div>
      <div class="card"><h2>Comparación malla base vs calendario ${esc(m.modalidad)}</h2>
        <div class="sub">Clic en la sigla para desplegar las sesiones. Dif. HP = HP programadas − HP malla.</div>
        ${tablaMallaVs(m)}</div>
      <div class="card"><h2>Hallazgos</h2>
        <div class="sub">(1) cumplimientos · (2) advertencias · (3) incumplimientos críticos · (4) recomendación en cursiva</div>
        ${tablaHallazgos(H,m.id)}</div>`});
  });

  /* --- comparación --- */
  if(D&&D.comparacion){
    const C=D.comparacion.filas, na=D.comparacion.a, nb=D.comparacion.b;
    const dif=C.filter(c=>c.diferencias.length).length;
    secciones.push({titulo:'Comparación '+na+' vs '+nb, after:()=>{}, html:`
      <div class="kpis">${kpi(C.length,'Asignaturas contrastadas')}
        ${kpi(dif,'Con desviaciones',dif?'warn':'ok')}${kpi(C.length-dif,'Idénticas','ok')}</div>
      <div class="card"><h2>Contraste entre versiones del programa</h2>
        <div class="sub">Detecta desviaciones entre modalidades o entre calendarios de años sucesivos.</div>
        ${tablaComparacion(C,na,nb)}</div>`});
  }

  /* --- validación SPA --- */
  if(D&&D.spa) secciones.push({titulo:'Validación SPA', after:wireSPA, html:seccionSPA(D)});

  /* --- reporte de programación --- */
  if(D) secciones.push({titulo:'Reporte de Programación', after:wireReporte, html:seccionReporte()});

  /* --- creación de calendario (siempre disponible) --- */
  secciones.push({titulo:'Creación de Calendario', after:wireCreador, html:seccionCreador()});

  /* --- fichas financieras (siempre disponible) --- */
  secciones.push({titulo:'Fichas Financieras', after:wireFichas, html:seccionFichas()});

  /* --- períodos académicos (siempre disponible) --- */
  secciones.push({titulo:'Períodos Académicos', after:wirePeriodos, html:seccionPeriodos()});

  /* --- pintar --- */
  const tabs=$('tabs'), panels=$('panels');
  tabs.innerHTML=''; panels.innerHTML='';
  if(TAB_ACTIVA>=secciones.length) TAB_ACTIVA=0;
  secciones.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===TAB_ACTIVA?' active':''); b.textContent=s.titulo;
    b.onclick=()=>render(i);
    tabs.appendChild(b);
    const d=document.createElement('div');
    d.className='panel'+(i===TAB_ACTIVA?' active':''); d.id='p'+i; d.innerHTML=s.html;
    panels.appendChild(d);
  });
  if(!D){
    const b=document.createElement('button');
    b.className='tab'; b.textContent='Detalle por calendario'; b.disabled=true; tabs.appendChild(b);
  }
  secciones[TAB_ACTIVA].after();
  ocultarMallaPop(); wireMallaPop();
  $('hsub').textContent = D
    ? `Programa ${D.programa} · ${D.modalidades.length} calendario(s) analizado(s) · ${new Date().toLocaleDateString('es-CL')}`
    : 'Cargue la malla y los calendarios académicos para ejecutar la validación';
}

render();
</script></body></html>
